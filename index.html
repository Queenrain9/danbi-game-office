  <style>
    :root {

      --accent-2: #9cc0ff;
      --green: #55d6a8;
      --amber: #f3c86a;
      --red: #ff7d8e;
      --purple: #bc9cff;
      --cyan: #67d9eb;

      --radius: 18px;

    * { box-sizing: border-box; }

    .sidebar { position: sticky; top: 0; height: 100vh; padding: 26px 18px 20px; border-right: 1px solid rgba(255,255,255,.06); background: rgba(8,18,31,.92); backdrop-filter: blur(18px); overflow-y: auto; }

    .nav-item:hover { background: rgba(116,167,255,.08); color: #e5efff; }

    .page-title { font-weight:760; font-size:18px; letter-spacing:-.02em; }

    .btn:hover { transform: translateY(-1px); border-color:rgba(116,167,255,.32); }

    .btn.warn { color:#ffe5a2; background:rgba(160,112,29,.18); border-color:rgba(243,200,106,.28); }

    .content { padding:30px 28px 80px; max-width: 1600px; margin:0 auto; }
    .hero { display:grid; grid-template-columns: 1.5fr .85fr; gap:18px; margin-bottom:22px; }
    .hero-main, .hero-side { border:1px solid rgba(255,255,255,.065); background:linear-gradient(145deg,rgba(18,35,59,.9),rgba(10,23,40,.95)); border-radius:24px; box-shadow:var(--shadow); }
    .hero-main { padding:26px; position:relative; overflow:hidden; }

    .hero-side { padding:22px; }

    .meter-row { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:7px; }
    .meter { height:8px; background:#07101b; border-radius:999px; overflow:hidden; border:1px solid rgba(255,255,255,.04); }
    .meter > i { display:block; height:100%; width:74%; background:linear-gradient(90deg,#5b8ddb,#61d2dc); border-radius:inherit; }
    .gate-note { font-size:12px; color:#93a9c2; line-height:1.55; padding:12px; border-radius:12px; background:rgba(0,0,0,.12); }
    .section-head { display:flex; align-items:end; justify-content:space-between; margin:30px 0 14px; gap:16px; }
    .section-head h2 { margin:0; font-size:17px; letter-spacing:-.02em; }
    .section-head p { margin:5px 0 0; font-size:12px; color:var(--muted); }
    .stats { display:grid; grid-template-columns: repeat(8,minmax(0,1fr)); gap:10px; }
    .stat { padding:15px 14px; border:1px solid rgba(255,255,255,.055); background:#0d1a2c; border-radius:15px; min-height:90px; }
    .stat .n { font-size:25px; font-weight:780; letter-spacing:-.04em; }
    .stat .label { color:#8297b2; font-size:11px; margin-top:5px; line-height:1.35; }
    .stat .delta { margin-top:7px; color:#59d3aa; font-size:10px; }
    .dashboard-grid { display:grid; grid-template-columns: 1.35fr .85fr; gap:18px; }
    .panel { border:1px solid rgba(255,255,255,.06); background:rgba(13,26,44,.92); border-radius:18px; padding:18px; box-shadow:0 12px 30px rgba(0,0,0,.12); }
    .panel-title { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
    .panel-title strong { font-size:14px; }
    .panel-title span { font-size:11px; color:var(--muted); }
    .pipeline { display:flex; align-items:stretch; gap:8px; overflow:auto; padding-bottom:4px; }
    .stage { min-width:115px; flex:1; background:#0a1627; border:1px solid rgba(255,255,255,.055); border-radius:14px; padding:13px 12px; }
    .stage.current { border-color:rgba(116,167,255,.28); background:#10213a; }
    .stage .stage-name { color:#8da2bc; font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
    .stage .stage-count { font-size:23px; margin:7px 0 2px; font-weight:770; }
    .stage .stage-auto { font-size:9px; color:#54708f; }
    .activity { display:flex; flex-direction:column; gap:10px; max-height:310px; overflow:auto; }
    .activity-item { display:grid; grid-template-columns: 54px 1fr; gap:10px; font-size:12px; }
    .activity-time { color:#60748f; font-variant-numeric:tabular-nums; }
    .activity-text { color:#bdcce0; line-height:1.45; }
    .cards { display:grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap:14px; }
.idea-cards { grid-template-columns: repeat(auto-fit,minmax(270px,1fr)); align-items:stretch; gap:10px; }

/* Idea Lab — quiet queue UI */
.idea-workspace{display:block}
.idea-queue-toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;margin-bottom:9px}
.idea-search{height:40px}
.idea-filter-menu{position:relative}
.idea-filter-menu summary{list-style:none;cursor:pointer;height:40px;display:flex;align-items:center;justify-content:center;padding:0 12px;border-radius:11px;border:1px solid rgba(255,255,255,.07);background:#091625;color:#94a9c1;font-size:10px;font-weight:700;user-select:none}

.idea-queue-tabs{margin:0 0 10px;gap:5px}
.idea-queue-tab{padding:6px 9px;background:transparent}
.idea-queue-count{display:none}
.idea-card{min-height:126px;padding:13px}
.idea-card .card-title{font-size:14px}
.idea-card .card-desc{margin:8px 0 10px;-webkit-line-clamp:2;color:#aebfd2}

    .card-actions { display:flex; gap:7px; flex-wrap:wrap; margin-top:14px; }
    .card-actions .btn { padding:7px 9px; border-radius:9px; font-size:11px; }
    .filters { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { border:1px solid rgba(255,255,255,.07); background:#0c182a; color:#89a0bc; border-radius:999px; padding:7px 10px; font-size:11px; }
    .chip.active { color:white; border-color:rgba(116,167,255,.3); background:rgba(77,123,194,.2); }
    .empty { text-align:center; padding:48px 20px; color:#758ba6; border:1px dashed rgba(255,255,255,.08); border-radius:18px; }
    .table-wrap { overflow:auto; border:1px solid rgba(255,255,255,.05); border-radius:14px; }
    table { width:100%; border-collapse:collapse; min-width:780px; }
    th,td { padding:12px 13px; text-align:left; border-bottom:1px solid rgba(255,255,255,.045); font-size:11px; }
    th { color:#6f87a3; font-weight:650; background:#0a1627; }
    td { color:#b8c7d9; }
    tr:last-child td { border-bottom:0; }
    .score { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:12px; }
    .score > div { background:rgba(0,0,0,.12); border-radius:10px; padding:8px; }
    .score b { display:block; font-size:13px; }
    .score span { font-size:9px; color:#6e86a3; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .detail-box { background:#0a1627; border:1px solid rgba(255,255,255,.055); border-radius:14px; padding:14px; }
    .detail-box h3 { margin:0 0 9px; font-size:12px; }
    .detail-box p, .detail-box li { font-size:11px; color:#91a5bd; line-height:1.6; }
    textarea, input, select { width:100%; color:#d9e8fa; background:#081422; border:1px solid #243a56; border-radius:11px; padding:10px 11px; outline:none; }
    textarea:focus, input:focus, select:focus { border-color:#4c79b8; box-shadow:0 0 0 3px rgba(76,121,184,.12); }
    textarea { min-height:100px; resize:vertical; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    label { display:block; font-size:10px; color:#7890ad; margin:0 0 6px; }
    .switch-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid rgba(255,255,255,.045); }
    .switch-row:last-child { border-bottom:0; }
    .switch-row strong { display:block; font-size:12px; }
    .switch-row span { display:block; color:#6f85a0; font-size:10px; margin-top:3px; }
    .switch { width:42px; height:24px; border-radius:999px; border:0; padding:3px; background:#26384d; flex:none; }
    .switch i { display:block; width:18px; height:18px; border-radius:50%; background:#8090a4; transition:.2s; }
    .switch.on { background:#315f99; }
    .switch.on i { transform:translateX(18px); background:#d9eaff; }
    .modal-backdrop { position:fixed; inset:0; background:rgba(1,6,11,.7); z-index:30; display:none; place-items:center; padding:20px; backdrop-filter:blur(7px); }
    .modal-backdrop.show { display:grid; }
    .modal { width:min(720px,100%); max-height:82vh; overflow:auto; background:#0c192a; border:1px solid #29425f; border-radius:20px; box-shadow:0 30px 90px rgba(0,0,0,.45); padding:21px; }
    .modal.wide { width:min(1180px,100%); }
    .wf-viewer { display:grid; grid-template-columns:190px minmax(280px,420px) minmax(0,1fr); gap:14px; align-items:start; }
    .wf-screen-list { display:flex; flex-direction:column; gap:7px; max-height:65vh; overflow:auto; }
    .wf-screen-tab { border:1px solid rgba(255,255,255,.07); border-radius:10px; background:#0a1627; color:#8298b4; padding:9px 10px; text-align:left; font-size:10px; }
    .wf-screen-tab.active { background:#173050; border-color:#416b9e; color:#eef6ff; }
    .wf-device-wrap { display:flex; justify-content:center; align-items:flex-start; }
    .wf-device { width:min(100%,390px); aspect-ratio:390/844; position:relative; overflow:hidden; border:1px solid #3a526d; border-radius:24px; background:#08121f; box-shadow:inset 0 0 0 5px #0e1b2d; }
    .wf-device.landscape { aspect-ratio:844/390; max-width:100%; }
    .wf-region,.wf-component { position:absolute; display:flex; align-items:center; justify-content:center; text-align:center; padding:3px; overflow:hidden; line-height:1.15; }
    .wf-region { border:1px dashed #46617e; background:rgba(92,124,160,.08); color:#7390b0; font-size:8px; }
    .wf-component { border:1px solid #6b88aa; background:rgba(116,167,255,.12); color:#c6daf2; font-size:8px; z-index:2; }
    .wf-component.action { border-color:#6aa991; background:rgba(85,214,168,.12); color:#bdebdc; }
    .wf-component.overlay { border-color:#9376bd; background:rgba(188,156,255,.12); color:#dccbff; }
    .wf-detail { display:flex; flex-direction:column; gap:10px; min-width:0; }
    .wf-detail pre { white-space:pre-wrap; word-break:break-word; color:#9fb3cb; font-size:10px; line-height:1.55; margin:0; }
    .wf-flow { display:flex; flex-wrap:wrap; gap:6px; }
    .wf-card-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:12px 0; }
    .wf-card-stats > div { background:rgba(0,0,0,.12); border-radius:10px; padding:9px; }
    .wf-card-stats b { display:block; font-size:14px; }
    .wf-card-stats span { font-size:9px; color:#6e86a3; }
    .wf-pack-nav { display:flex; gap:7px; flex-wrap:wrap; margin:10px 0 16px; padding-bottom:12px; border-bottom:1px solid rgba(255,255,255,.06); }
    .wf-pack-nav button { border:1px solid rgba(255,255,255,.07); background:#0a1627; color:#7890ad; border-radius:9px; padding:7px 11px; font-size:10px; }
    .wf-pack-nav button.active { color:#eef6ff; background:#173050; border-color:#416b9e; }
    .wf-preview-column { position:sticky; top:0; align-self:start; }
    .wf-variant-list { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 10px; }
    .wf-variant-btn { border:1px solid rgba(255,255,255,.07); background:#0a1627; color:#768eaa; border-radius:999px; padding:5px 8px; font-size:9px; }
    .wf-variant-btn.active { color:#dff7ee; border-color:rgba(85,214,168,.34); background:rgba(85,214,168,.09); }
    .wf-human-card { border:1px solid rgba(255,255,255,.055); background:#0a1627; border-radius:12px; padding:11px; }
    .wf-human-card + .wf-human-card { margin-top:8px; }
    .wf-human-card h4 { margin:0 0 8px; font-size:11px; color:#dce9fa; }
    .wf-kv { display:grid; grid-template-columns:92px 1fr; gap:6px 10px; align-items:start; font-size:10px; line-height:1.45; }
    .wf-kv b { color:#6f87a4; font-weight:650; text-transform:uppercase; letter-spacing:.04em; }
    .wf-kv span { color:#aebfd3; word-break:break-word; }
    .wf-state-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .wf-rule-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .wf-raw pre { white-space:pre-wrap; word-break:break-word; color:#91a8c2; font-size:10px; line-height:1.55; margin:0; }
    .wf-core-flag { display:inline-flex; margin-left:6px; color:#8de4c7; font-size:8px; border:1px solid rgba(85,214,168,.22); padding:2px 5px; border-radius:999px; }
    .wf-screen-header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
    .wf-screen-header strong { font-size:11px; }

    .modal-head { display:flex; justify-content:space-between; gap:12px; margin-bottom:16px; }
    .modal-head h2 { margin:0; font-size:18px; }
    .close { background:transparent; border:0; color:#8ba0ba; font-size:22px; }
    .toast { position:fixed; right:24px; bottom:24px; z-index:50; background:#17304f; border:1px solid #365d8d; color:#e9f3ff; border-radius:12px; padding:11px 14px; font-size:12px; box-shadow:var(--shadow); opacity:0; transform:translateY(10px); pointer-events:none; transition:.22s; }
    .toast.show { opacity:1; transform:none; }
    .mobile-menu { display:none; }
    .kicker { color:#6f86a4; font-size:10px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:5px; }
    .human-gate { padding:12px; border-radius:12px; border:1px solid rgba(188,156,255,.16); background:rgba(188,156,255,.06); font-size:11px; color:#aa9ad0; line-height:1.55; margin-top:11px; }
    .review-card { border-color:rgba(116,167,255,.14); }
    .review-status { font-size:10px; color:#7e96b3; margin-top:8px; }
    .decision { margin-top:13px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; }
    .decision .btn { padding:8px 5px; font-size:10px; }
    .log-dot { width:7px; height:7px; border-radius:50%; background:#5d84b7; display:inline-block; margin-right:7px; }
    @media (max-width:1200px) {
      .stats { grid-template-columns: repeat(4,1fr); }
      .cards { grid-template-columns: repeat(2,1fr); }
    }
    @media (max-width:900px) {
      .app { grid-template-columns:1fr; }
      .sidebar { position:fixed; z-index:40; left:0; top:0; width:280px; transform:translateX(-102%); transition:.22s; box-shadow:20px 0 60px rgba(0,0,0,.35); }
      .sidebar.open { transform:none; }
      .mobile-menu { display:inline-flex; }
      .topbar { padding:0 16px; height:65px; }
      .content { padding:22px 16px 70px; }
      .hero, .dashboard-grid, .two-col, .wf-viewer { grid-template-columns:1fr; }
      .wf-screen-list { flex-direction:row; max-height:none; overflow:auto; }
      .wf-screen-tab { min-width:130px; }
      .wf-preview-column { position:relative; top:auto; }
      .wf-rule-grid, .wf-state-grid { grid-template-columns:1fr; }

    }
    @media (max-width:620px) {
      .stats { grid-template-columns: repeat(2,1fr); }
      .cards, .idea-cards { grid-template-columns:1fr; }
      .hero h1 { font-size:25px; }
      .hero-main, .hero-side { border-radius:18px; }
      .top-actions .hide-mobile { display:none; }
      .form-row { grid-template-columns:1fr; }
    }
  
/* Planning HQ — representative decision dashboard */
.planning-action-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.planning-action{min-height:142px;padding:16px;border:1px solid rgba(255,255,255,.06);border-radius:17px;background:linear-gradient(145deg,rgba(17,34,57,.96),rgba(10,24,41,.96));display:flex;flex-direction:column}
.planning-action.attn{border-color:rgba(243,200,106,.28);box-shadow:inset 0 0 0 1px rgba(243,200,106,.04)}
.planning-action.ok{border-color:rgba(85,214,168,.17)}
.planning-action .pa-label{font-size:10px;color:#7189a7;letter-spacing:.08em;text-transform:uppercase}
.planning-action .pa-value{font-size:27px;font-weight:800;letter-spacing:-.04em;margin:8px 0 4px}
.planning-action .pa-copy{font-size:11px;color:#90a4bd;line-height:1.48}
.planning-action .pa-copy b{color:#dce8f8;font-weight:650}
.planning-action .card-actions{margin-top:auto;padding-top:11px}
.planning-pipeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.planning-stage-card{border:1px solid rgba(255,255,255,.06);background:#0d1a2c;border-radius:17px;padding:16px}
.planning-stage-top{display:flex;justify-content:space-between;gap:12px;align-items:start}
.planning-stage-title{font-size:15px;font-weight:750}
.planning-stage-count{font-size:25px;font-weight:800;letter-spacing:-.04em}
.planning-stage-sub{font-size:10px;color:#7188a4;margin-top:2px}
.planning-mini-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.planning-mini{font-size:10px;color:#9cb0c8;padding:5px 7px;border-radius:8px;background:#091728;border:1px solid rgba(255,255,255,.04)}
.planning-next-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.planning-queue{display:flex;flex-direction:column;gap:8px}
.planning-queue-item{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 11px;border-radius:12px;background:#091728;border:1px solid rgba(255,255,255,.045)}
.planning-queue-num{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#122541;color:#88b2f4;font-size:10px;font-weight:800}
.planning-queue-title{font-size:12px;font-weight:690;color:#e3edf9}
.planning-queue-sub{font-size:9px;color:#7188a4;margin-top:3px}
.planning-priority-mark{font-size:10px;color:#f3c86a}
.planning-output-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.planning-output{padding:11px 12px;border-radius:12px;background:#091728;border:1px solid rgba(255,255,255,.045)}
.planning-output b{display:block;font-size:12px;color:#e2ecf8}
.planning-output span{display:block;font-size:9px;color:#7188a4;margin-top:4px}
@media(max-width:1100px){.planning-action-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.planning-pipeline{grid-template-columns:1fr}.planning-next-grid{grid-template-columns:1fr}}
@media(max-width:700px){.planning-action-grid{grid-template-columns:1fr}.planning-output-list{grid-template-columns:1fr}}


/* CEO dashboard v2 — cross-department control room */
.ceo-shell{display:grid;gap:18px}
.ceo-status{display:grid;grid-template-columns:190px minmax(0,1fr);padding:0;border:1px solid rgba(255,255,255,.07);background:linear-gradient(145deg,#10233a,#0b1b2e);border-radius:18px;overflow:hidden}
.ceo-status-summary{display:flex;align-items:center;gap:12px;padding:20px 18px;background:rgba(51,82,115,.22);border-right:1px solid rgba(255,255,255,.06)}
.ceo-lamp{width:13px;height:13px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(85,214,168,.08),0 0 18px rgba(85,214,168,.34);flex:none}
.ceo-lamp.warn{background:var(--amber);box-shadow:0 0 0 5px rgba(243,200,106,.08),0 0 18px rgba(243,200,106,.32)}
.ceo-status-summary strong{display:block;font-size:14px}
.ceo-status-summary span{display:block;color:#7890aa;font-size:10px;line-height:1.5;margin-top:3px}
.ceo-dept-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:12px 8px}
.ceo-dept{min-width:0;padding:8px 16px;border-right:1px solid rgba(255,255,255,.045)}
.ceo-dept:nth-child(3n){border-right:0}
.ceo-dept:nth-child(n+4){border-top:1px solid rgba(255,255,255,.035)}
.ceo-dept-head{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:730;color:#dce8f8}
.ceo-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.ceo-dot.warn{background:var(--amber)}
.ceo-dept-meta{font-size:9px;color:#67809e;margin-top:6px;line-height:1.45}
.ceo-dept-meta.warn{color:#e7bb5f}
.ceo-top-grid{display:grid;grid-template-columns:minmax(330px,.82fr) minmax(0,1.18fr);gap:18px}
.ceo-panel{border:1px solid rgba(255,255,255,.065);background:rgba(13,26,44,.94);border-radius:18px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.12)}
.ceo-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.ceo-panel-head h2{margin:0;font-size:16px;letter-spacing:-.025em}
.ceo-panel-head span{font-size:9px;color:#5f7998;line-height:1.45;text-align:right}
.ceo-inbox{display:grid;gap:8px}
.ceo-inbox-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:11px;align-items:center;padding:11px 12px;background:#091728;border:1px solid rgba(255,255,255,.05);border-radius:12px}
.ceo-inbox-row.attn{border-color:rgba(243,200,106,.30);background:linear-gradient(90deg,rgba(94,70,23,.14),#091728 46%)}
.ceo-inbox-num{font-size:23px;font-weight:820;letter-spacing:-.05em;color:#7e9bbb;text-align:center}
.ceo-inbox-row.attn .ceo-inbox-num{color:var(--amber)}
.ceo-inbox-copy b{display:block;font-size:11px;color:#e2ecf8}
.ceo-inbox-copy span{display:block;font-size:9px;color:#7188a4;line-height:1.45;margin-top:3px}
.ceo-inbox-row .btn{padding:7px 9px;font-size:9px}
.ceo-empty-ok{display:grid;place-items:center;text-align:center;min-height:120px;border:1px solid rgba(85,214,168,.15);background:rgba(85,214,168,.035);border-radius:13px;color:#8de4c7;font-size:14px;font-weight:750}
.ceo-watch{margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.055)}
.ceo-watch-title{font-size:9px;color:#607a98;margin-bottom:8px}
.ceo-watch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:5px 2px;font-size:9px}
.ceo-watch-row span:first-child{color:#7b97b4}
.ceo-watch-row b{font-size:10px;color:#cbd8e8;text-align:right}
.ceo-ship-empty-label{font-size:9px;color:#637e9e;margin-bottom:3px}
.ceo-ship-title{font-size:21px;font-weight:820;letter-spacing:-.04em;margin:0 0 4px}
.ceo-ship-sub{font-size:9px;color:#66819e;margin-bottom:14px}
.ceo-timeline{position:relative;padding-left:22px;margin-top:5px}
.ceo-timeline:before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:#24405f}
.ceo-step{position:relative;padding:0 0 13px 0}
.ceo-step:last-child{padding-bottom:0}
.ceo-step:before{content:"";position:absolute;left:-21px;top:1px;width:13px;height:13px;border-radius:50%;background:#18314e;border:2px solid #55789f}
.ceo-step.done:before{background:#16473f;border-color:#55d6a8}
.ceo-step.fail:before{background:#4a2430;border-color:#ff7d8e}

.ceo-step b{display:block;font-size:11px;color:#dfe9f7}

.ceo-issue-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

.ceo-ready-card{padding:15px;border-radius:14px;border:1px solid rgba(85,214,168,.19);background:linear-gradient(145deg,rgba(24,62,57,.32),#0a1829)}

.ceo-ready-card p{margin:0 0 12px;color:#7891aa;font-size:9px;line-height:1.5}

.ceo-stage-group{font-size:7px;color:#496887;text-transform:uppercase;letter-spacing:.08em}

.ceo-stage-count{font-size:25px;font-weight:820;letter-spacing:-.055em;margin-top:5px}

.ceo-stage.ready .ceo-stage-count{color:#55d6a8}
.ceo-stage-note{font-size:8px;color:#617b98;margin-top:4px;line-height:1.35}

<script>
const STAGES = ["idea","design","wireframe","build","playtest","directed","visual","archive"];
const STAGE_LABEL = {
  idea:"Idea Lab", design:"Game Design",
  wireframe:"Pre-production", build:"Build Farm", playtest:"Review Room",
  directed:"Directed Development", visual:"Visual Development", archive:"Archive"
};
const NAV = [
  ["대표실", [["dashboard","▦","대표 대시보드"]]],
  ["AI 기획본부", [
    ["planning","▦","기획본부 대시보드"],
    ["ideas","♢","아이디어 연구소"],
    ["design","◇","게임 디자인실"],
    ["wireframe","▤","프리프로덕션"]
  ]],
  ["AI 제작본부", [
    ["implementation","≣","구현 설계실"],
    ["build","⌘","빌드 팜"],
    ["fidelity","✓","설계 검수실"],
    ["diagnostic","⌁","빌드 진단실"],
    ["enhancement","◆","게임 고도화실"]
  ]],
  ["단비 업무실", [
    ["review","▶","플레이테스트실"]
  ]],
  ["AI 아트 제작본부", [
    ["art_direction","✦","아트 디렉션실"],
    ["asset_spec","▤","에셋 설계실"],
    ["asset_production","◇","에셋 제작실"],
    ["visual_integration","⌘","비주얼 통합실"]
  ]],
  ["스튜디오 기록", [
    ["graveyard","□","폐기작 기록실"],
    ["activity","≋","제작 활동 로그"]
  ]],
  ["시스템", [
    ["settings","⚙","스튜디오 설정"]
  ]]
];

function seedState() {
  return {
    settings: { autoBuild:true, humanGate:true },
    projects: [],
    activity: []
  };
}
const CLOUD_URL = "https://hmblaasagxyntyfrfztg.supabase.co/functions/v1/danbi-game-office-sync";
let cloudReady = false;
let cloudTimer = null;
let pipelinePollTimer = null;
let promotedIdeas = [];
let ideaPairwiseVotes = [];
let ideaLabMode = localStorage.getItem("danbiIdeaLabMode") || "all";
let ideaQueueFilter = localStorage.getItem("danbiIdeaQueueFilter") || "all";
let ideaGenreFilter = localStorage.getItem("danbiIdeaGenreFilter") || "all";
let ideaSortMode = localStorage.getItem("danbiIdeaSortMode") || "queue";
let ideaSearchQuery = "";
let gameDesigns = [];
let wireframePacks = [];
let implementationContracts = [];
let buildJobs = [];
let fidelityReviews = [];
let repairTickets = [];
let playtestShowcases = [];
let playtestReadyBuilds = [];
let playtestFocusId = null;
let playtestDecisions = [];
let playtestDiagnostics = [];
let enhancementProjects = [];
let artProjects = [];
let graveyardProjects = [];
let playtestDraft = {};
let ceoDashboardSnapshot = null;
let state = load();
let current = (location.hash || "#dashboard").slice(1);

function load(){ try{ return JSON.parse(localStorage.getItem("danbiGameOfficeV1")) || seedState(); }catch(e){ return seedState(); } }

function save(){
  localStorage.setItem("danbiGameOfficeV1", JSON.stringify(state));
  queueCloudSave();
}

function publicHeaders(){
  return {"Content-Type":"application/json"};
}

function setCloudStatus(text, ok=false){
  const el=document.getElementById("cloudStatus");
  if(!el) return;
  el.textContent=text;
  el.style.color=ok?"#75dcb9":"#9bc0ff";
}

async function cloudRequest(method, body){
  const res=await fetch(CLOUD_URL,{
    method,
    headers:publicHeaders(),
    body: body ? JSON.stringify(body) : undefined,
    cache:"no-store"
  });
  if(!res.ok) {
    const payload=await res.json().catch(()=>({}));
    throw new Error(payload.error || ("HTTP "+res.status));
  }
  return res.json();
}


async function loadCeoDashboard(showToast=false){
  try{
    const res=await fetch(CLOUD_URL+"?view=ceo_dashboard",{
      method:"GET",
      headers:publicHeaders(),
      cache:"no-store"
    });
    if(!res.ok){
      const payload=await res.json().catch(()=>({}));
      throw new Error(payload.error || ("HTTP "+res.status));
    }
    const payload=await res.json();
    ceoDashboardSnapshot=payload.dashboard||null;
    if(current==="dashboard") render();
    if(showToast) toast("대표 대시보드 집계 새로고침");
  }catch(err){
    console.error("CEO dashboard load failed",err);
    if(showToast) toast("대표 대시보드 집계 불러오기 실패");
  }
}

async function loadPromotedIdeas(showToast=false){
  try{
    const res=await fetch(CLOUD_URL+"?view=ideas&limit=300",{
      method:"GET",
      headers:publicHeaders(),
      cache:"no-store"
    });
    if(!res.ok){
      const payload=await res.json().catch(()=>({}));
      throw new Error(payload.error || ("HTTP "+res.status));
    }
    const payload=await res.json();
    promotedIdeas=Array.isArray(payload.ideas)?payload.ideas:[];
    if(current==="ideas" || current==="dashboard") render();
    if(showToast) toast(`Idea Lab 새로고침 · ${promotedIdeas.length}개`);
  }catch(err){
    console.error("Idea Lab load failed",err);
    if(showToast) toast("Idea Lab 불러오기 실패");
  }
}

async function loadIdeaSelection(showToast=false){
  try{
    const res=await fetch(CLOUD_URL+"?view=idea_selection&limit=1000",{
      method:"GET",
      headers:publicHeaders(),
      cache:"no-store"
    });
    if(!res.ok) throw new Error("HTTP "+res.status);
    const payload=await res.json();
    ideaPairwiseVotes=Array.isArray(payload.votes)?payload.votes:[];
    if(current==="ideas") render();
    if(showToast) toast("대표 선별 기록 새로고침");
  }catch(err){
    console.error("Idea selection load failed",err);
    if(showToast) toast("대표 선별 기록 불러오기 실패");
  }
}

function setIdeaLabMode(mode){
  ideaLabMode=mode==="curate"?"curate":"all";
  localStorage.setItem("danbiIdeaLabMode",ideaLabMode);
  render();
}

async function setIdeaBucket(id,bucket){
  const p=promotedIdeas.find(x=>x.id===id);
  if(!p) return;

function ideaWins(id){
  return ideaPairwiseVotes.reduce((n,v)=>n+(v.winner_id===id?1:0),0);
}
function ideaLosses(id){
  return ideaPairwiseVotes.reduce((n,v)=>n+(v.loser_id===id?1:0),0);
}
function ideaCompared(a,b){
  return ideaPairwiseVotes.some(v=>(v.winner_id===a&&v.loser_id===b)||(v.winner_id===b&&v.loser_id===a));
}
function nextIdeaPair(){
  const pool=promotedIdeas.filter(x=>x.curation_bucket==="attract");
  if(pool.length<2) return null;
  const sorted=[...pool].sort((a,b)=>{
    const da=ideaWins(a.id)-ideaLosses(a.id), db=ideaWins(b.id)-ideaLosses(b.id);
    if(da!==db) return db-da;
    return new Date(a.curation_bucket_at||a.created_at||0)-new Date(b.curation_bucket_at||b.created_at||0);
  });
  let best=null;
  for(let i=0;i<sorted.length;i++){
    for(let j=i+1;j<sorted.length;j++){
      if(ideaCompared(sorted[i].id,sorted[j].id)) continue;
      const gap=Math.abs((ideaWins(sorted[i].id)-ideaLosses(sorted[i].id))-(ideaWins(sorted[j].id)-ideaLosses(sorted[j].id)));
      if(!best || gap<best.gap) best={a:sorted[i],b:sorted[j],gap};
    }
  }
  return best ? [best.a,best.b] : null;
}

function playtestRows(){
  const byBuild=new Map();
  for(const b of playtestReadyBuilds){
    byBuild.set(b.id,{
      build_job_id:b.id,
      contract_id:b.contract_id,
      design_id:b.design_id,
      idea_id:b.idea_id,
      title:b.title,
      one_line:b.build_summary||"",
      project_path:b.project_path,
      repo_full_name:b.repo_full_name||"Queenrain9/danbi-game-office",
      repo_branch:b.repo_branch||"main",
      final_commit:b.last_commit,
      blueprint_hash:b.blueprint_hash,
      art_options:[],
      status:"awaiting_intake",
      generation_note:"Static Fidelity PASS · Playtest Intake 입고 대기",
      last_error:null,
      updated_at:b.updated_at||b.created_at,
      build:b
    });
  }
  for(const s of playtestShowcases){
    const prior=byBuild.get(s.build_job_id)||{};
    byBuild.set(s.build_job_id,{...prior,...s,build:prior.build||null});
  }
  return [...byBuild.values()].sort((a,b)=>{
    const rank=x=>x.status==="ready"?0:x.status==="preparing"?1:x.status==="awaiting_intake"?2:3;
    const d=rank(a)-rank(b);
    if(d) return d;
    return new Date(b.updated_at||0)-new Date(a.updated_at||0);
  });
}

  const row=playtestShowcases.find(x=>x.id===showcaseId);

  const noteEl=document.getElementById("playtestDecisionNote");
  const note=(noteEl?noteEl.value:draft.note||"").trim();
  const art=draft.art||null;
  if(decision==="UNJUDGEABLE" && !note){
    toast("판단할 수 없었던 문제를 짧게 적어주세요.");
    noteEl?.focus();
    return;
  }
  if(decision==="KEEP" && !art && !note){
    toast("아트 A/B/C를 고르거나 원하는 방향을 메모해주세요.");

    return;
  }
  try{
    await cloudRequest("POST",{
      action:"submit_playtest_decision",
      showcase_id:showcaseId,
      decision,
      selected_art_option:art,
      decision_note:note
    });
    delete playtestDraft[showcaseId];

  }catch(err){

  }
}

function ceoAge(raw){
  if(!raw) return "기록 없음";
  const t=new Date(raw).getTime();
  if(!Number.isFinite(t)) return "기록 없음";
  const ms=Math.max(0,Date.now()-t);
  const m=Math.floor(ms/60000);
  if(m<60) return Math.max(1,m)+"분 전";
  const h=Math.floor(m/60);
  if(h<24) return h+"시간 전";
  return Math.floor(h/24)+"일 전";
}
function ceoClock(raw){
  if(!raw) return "";
  const d=new Date(raw);
  if(Number.isNaN(d.getTime())) return "";
  return d.toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
}
function ceoHealthLabel(h){

    stale:"지연",stale_running:"장시간 실행 중",unknown:"기록 없음"
  })[h]||h||"기록 없음";
}

function planningAge(raw){
  if(!raw) return "-";
  const ms=Math.max(0,Date.now()-new Date(raw).getTime());
  const h=Math.floor(ms/3600000);
  if(h<1) return Math.max(1,Math.floor(ms/60000))+"분";
  if(h<24) return h+"시간";
  return Math.floor(h/24)+"일";
}

function planningQueue(items,status){
  return (Array.isArray(items)?items:[]).filter(x=>!status || x.status===status);
}

function planningPriorityOrder(items){
  return [...items].sort((a,b)=>{
    const pa=a.human_priority?1:0,pb=b.human_priority?1:0;
    if(pa!==pb) return pb-pa;
    if(pa&&pb){
      const ap=new Date(a.human_priority_at||a.created_at||0).getTime();
      const bp=new Date(b.human_priority_at||b.created_at||0).getTime();
      if(ap!==bp) return ap-bp;
    }
    return new Date(a.created_at||0)-new Date(b.created_at||0);
  });
}

function planningQueueList(items,emptyText){
  const rows=planningPriorityOrder(items).slice(0,3);
  if(!rows.length) return '<div class="empty" style="padding:18px">'+esc(emptyText)+'</div>';
  return '<div class="planning-queue">'+rows.map((p,i)=>{
    const wait=planningAge(p.created_at||p.source_run_at);
    return '<div class="planning-queue-item"><div class="planning-queue-num">'+(i+1)+'</div><div><div class="planning-queue-title">'+esc(p.title)+'</div><div class="planning-queue-sub">대기 '+esc(wait)+(p.human_priority?' · 대표 우선':' · 일반 순서')+'</div></div>'+(p.human_priority?'<div class="planning-priority-mark">★ 우선</div>':'')+'</div>';
  }).join("")+'</div>';
}

  ].sort((a,b)=>new Date(b.raw||0)-new Date(a.raw||0)).slice(0,6);
  if(!rows.length) return '<div class="empty">아직 생성된 기획 산출물이 없습니다.</div>';
  return '<div class="planning-output-list">'+rows.map(x=>{
    const when=x.raw?new Date(x.raw).toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}):"-";
    const archive=x.type==="Game Design"?(x.archive?' · GitHub ✓':' · GitHub 미보관'):"";
    return '<div class="planning-output"><b>'+esc(x.title)+'</b><span>'+esc(x.type)+' · '+esc(when)+archive+'</span></div>';
  }).join("")+'</div>';
}

function ideaGenreSource(p){
  return [p.genre,p.title,p.one_line,p.core_action].filter(Boolean).join(" ").toLocaleLowerCase("ko-KR");
}

function ideaBroadGenreTags(p){
  const text=ideaGenreSource(p);
  const tags=IDEA_GENRE_GROUPS.filter(group=>group.words.some(word=>text.includes(word))).map(group=>group.id);
  return tags.length?tags:["other"];
}

function availableIdeaGenreGroups(ps){
  const counts={};
  ideaPendingPool(ps).forEach(p=>ideaBroadGenreTags(p).forEach(tag=>counts[tag]=(counts[tag]||0)+1));
  const groups=IDEA_GENRE_GROUPS
    .filter(group=>counts[group.id])
    .map(group=>({...group,count:counts[group.id]}));
  if(counts.other) groups.push({id:"other",label:"기타",count:counts.other});
  return groups;
}

function setIdeaGenreFilter(value){
  const valid=["all",...IDEA_GENRE_GROUPS.map(x=>x.id),"other"];
  ideaGenreFilter=valid.includes(value)?value:"all";
  localStorage.setItem("danbiIdeaGenreFilter",ideaGenreFilter);
  render();
}

function setIdeaSortMode(value){
  ideaSortMode=["queue","latest","oldest","title"].includes(value)?value:"queue";

function ideaPendingPool(ps){
  return [...ps].filter(p=>!p.status || p.status==="idea_lab");
}

function ideaSearchText(p){
  const reasons=Array.isArray(p.why_promoted)?p.why_promoted:[];
  return [p.title,p.one_line,p.core_action,p.genre,p.platform,p.next_test,...reasons].filter(Boolean).join(" ").toLocaleLowerCase("ko-KR");
}

function filteredIdeaQueue(ps){
  let out=ideaPendingPool(ps);
  if(ideaQueueFilter==="priority") out=out.filter(p=>!!p.human_priority);
  if(ideaQueueFilter==="regular") out=out.filter(p=>!p.human_priority);
  if(ideaGenreFilter!=="all") out=out.filter(p=>ideaBroadGenreTags(p).includes(ideaGenreFilter));
  const tokens=(ideaSearchQuery||"").trim().toLocaleLowerCase("ko-KR").split(/\s+/).filter(Boolean);
  if(tokens.length) out=out.filter(p=>{
    const hay=ideaSearchText(p);
    return tokens.every(t=>hay.includes(t));
  });
  out.sort((a,b)=>{
    if(ideaSortMode==="latest") return new Date(b.created_at||0)-new Date(a.created_at||0);
    if(ideaSortMode==="oldest") return new Date(a.created_at||0)-new Date(b.created_at||0);
    if(ideaSortMode==="title") return String(a.title||"").localeCompare(String(b.title||""),"ko");
    const pa=a.human_priority?1:0, pb=b.human_priority?1:0;
    if(pa!==pb) return pb-pa;
    if(pa&&pb){
      const aa=new Date(a.human_priority_at||a.created_at||0), bb=new Date(b.human_priority_at||b.created_at||0);
      return aa-bb;
    }
    return new Date(a.created_at||0)-new Date(b.created_at||0);
  });
  return out;
}

function ideasCurationView(ps){
  const unclassified=[...ps].filter(x=>!x.curation_bucket).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  const attract=ps.filter(x=>x.curation_bucket==="attract");
  const hold=ps.filter(x=>x.curation_bucket==="hold");
  const pass=ps.filter(x=>x.curation_bucket==="pass");
  const currentIdea=unclassified[0]||null;
  const pair=nextIdeaPair();
  const ranked=[...attract].sort((a,b)=>{
    const sa=ideaWins(a.id)-ideaLosses(a.id), sb=ideaWins(b.id)-ideaLosses(b.id);
    if(sa!==sb) return sb-sa;
    if(ideaWins(a.id)!==ideaWins(b.id)) return ideaWins(b.id)-ideaWins(a.id);

function wfJson(value){
  if(value===null||value===undefined||value===""||(Array.isArray(value)&&!value.length)) return "<p>-</p>";
  const text=typeof value==="string"?value:JSON.stringify(value,null,2);
  return `<pre>${esc(text)}</pre>`;
}
function wfList(arr){
  return Array.isArray(arr)&&arr.length ? `<ul>${arr.map(x=>`<li>${esc(typeof x==="string"?x:JSON.stringify(x))}</li>`).join("")}</ul>` : "<p>-</p>";
}
function wfPct(v,fallback=0){
  const n=Number(v);
  return Number.isFinite(n)?Math.max(0,Math.min(100,n)):fallback;
}
function wfText(v){
  if(v===null||v===undefined||v==="") return "-";
  if(typeof v==="string"||typeof v==="number"||typeof v==="boolean") return String(v);
  return JSON.stringify(v);
}
function wfCard(title,rows){
  const content=rows.filter(x=>x[1]!==undefined&&x[1]!==null&&x[1]!=="").map(([k,v])=>`<b>${esc(k)}</b><span>${esc(wfText(v))}</span>`).join("");
  return `<div class="wf-human-card"><h4>${esc(title)}</h4><div class="wf-kv">${content||"<span>-</span>"}</div></div>`;
}
function wfInteractionCard(x,i){
  if(typeof x==="string") return wfCard("Interaction "+String(i+1).padStart(2,"0"),[["ACTION",x]]);
  return wfCard("Interaction "+String(i+1).padStart(2,"0"),[
    ["INPUT",x.input||x.trigger||x.gesture],
    ["TARGET",x.target||x.object],
    ["WHEN",x.precondition||x.condition],
    ["ACTION",x.action],
    ["STATE",x.state_change||x.change],
    ["FEEDBACK",x.feedback],
    ["INVALID",x.invalid_input||x.error]
  ]);
}
function wfStateCard(x,i){
  if(typeof x==="string") return wfCard("State · "+x,[["STATE",x]]);
  return wfCard("State · "+(x.id||x.state||String(i+1)),[
    ["ENTER",x.enter||x.entry_condition||x.condition],
    ["INPUT",x.input||x.allowed_input],
    ["UI",x.ui||x.visible_change||x.display],
    ["EXIT",x.exit||x.exit_condition]
  ]);
}
function wfTransitionCard(x,i){
  if(typeof x==="string") return wfCard("Transition "+String(i+1).padStart(2,"0"),[["FLOW",x]]);
  return wfCard("Transition "+String(i+1).padStart(2,"0"),[
    ["FROM",x.from],
    ["TO",x.to],
    ["TRIGGER",x.trigger],
    ["WHEN",x.condition],
    ["MOTION",x.animation||x.transition]
  ]);
}
function wfVariantData(screen,variantIndex){
  const variants=Array.isArray(screen?.state_variants)?screen.state_variants:[];
  const variant=variantIndex>0?variants[variantIndex-1]:null;
  return {variants,variant};
}
function wireframePreview(screen,orientation,variantIndex=0){
  const regions=Array.isArray(screen?.layout?.regions)?screen.layout.regions:[];
  const baseComponents=Array.isArray(screen?.components)?screen.components:[];
  const {variant}=wfVariantData(screen,variantIndex);
  const hidden=new Set(Array.isArray(variant?.hide_components)?variant.hide_components:[]);
  const overrides=variant?.component_overrides&&typeof variant.component_overrides==="object"?variant.component_overrides:{};
  const extra=Array.isArray(variant?.components)?variant.components:[];
  const components=baseComponents.filter(c=>!hidden.has(c.id)).map(c=>({...c,...(overrides[c.id]||{}),box:{...(c.box||{}),...((overrides[c.id]||{}).box||{})}})).concat(extra);
  const boxes=[];
  regions.forEach(r=>{
    boxes.push(`<div class="wf-region" style="left:${wfPct(r.x)}%;top:${wfPct(r.y)}%;width:${wfPct(r.w,10)}%;height:${wfPct(r.h,8)}%">${esc(r.label||r.id||"region")}</div>`);
  });
  components.forEach(c=>{
    const b=c.box||{};
    const type=String(c.type||"").toLowerCase();
    const cls=type.includes("overlay")||type.includes("modal")?"overlay":(type.includes("button")||type.includes("action")||type.includes("slider")?"action":"");
    if([b.x,b.y,b.w,b.h].some(v=>v!==undefined)){
      boxes.push(`<div class="wf-component ${cls}" title="${esc(c.id||c.label||"")}" style="left:${wfPct(b.x)}%;top:${wfPct(b.y)}%;width:${wfPct(b.w,12)}%;height:${wfPct(b.h,6)}%">${esc(c.label||c.id||c.type||"component")}</div>`);
    }
  });
  const empty=!boxes.length?`<div style="position:absolute;inset:20%;display:grid;place-items:center;text-align:center;color:#617997;font-size:10px;padding:20px">좌표 컴포넌트가 없습니다.</div>`:"";
  const variantLabel=variant?.name||variant?.id;
  return `<div class="wf-device ${String(orientation).toLowerCase().includes("land")?"landscape":""}">${boxes.join("")}${empty}${variantLabel?`<div style="position:absolute;right:8px;top:8px;z-index:4;font-size:8px;color:#9fe4cc;background:#10291f;border:1px solid #2a6653;padding:4px 6px;border-radius:999px">${esc(variantLabel)}</div>`:""}</div>`;
}
function wfPackNav(p,id,screenIndex,section,variantIndex){
  return `<div class="wf-pack-nav">
    ${[["screens","SCREENS"],["rules","RULES"],["handoff","HANDOFF"],["raw","RAW"]].map(([k,label])=>`<button class="${section===k?"active":""}" onclick="showWireframePack('${id}',${screenIndex},'${k}',${variantIndex})">${label}</button>`).join("")}
  </div>`;
}
function wfScreensSection(p,id,screenIndex,variantIndex){
  const screens=Array.isArray(p.screens)?p.screens:[];
  const idx=Math.max(0,Math.min(Math.max(0,screens.length-1),Number(screenIndex)||0));
  const sc=screens[idx]||{};
  const interactions=Array.isArray(sc.interactions)?sc.interactions:[];
  const states=Array.isArray(sc.states)?sc.states:[];
  const transitions=Array.isArray(sc.transitions)?sc.transitions:[];
  const {variants}=wfVariantData(sc,variantIndex);
  const tabs=screens.map((x,i)=>`<button class="wf-screen-tab ${i===idx?"active":""}" onclick="showWireframePack('${id}',${i},'screens',0)">${String(i+1).padStart(2,"0")} · ${esc(x.name||x.id||("Screen "+(i+1)))}${(p.core_screen&&(x.name===p.core_screen||x.id===p.core_screen))?' · CORE':''}</button>`).join("");
  const variantButtons=`<button class="wf-variant-btn ${variantIndex===0?"active":""}" onclick="showWireframePack('${id}',${idx},'screens',0)">BASE</button>`+
    variants.map((v,i)=>`<button class="wf-variant-btn ${variantIndex===i+1?"active":""}" onclick="showWireframePack('${id}',${idx},'screens',${i+1})">${esc(v.name||v.id||("STATE "+(i+1)))}</button>`).join("");
  const isCore=p.core_screen&&(sc.name===p.core_screen||sc.id===p.core_screen);
  return `
    <div class="wf-viewer">
      <div>
        <div class="kicker">Screens</div>
        <div class="wf-screen-list">${tabs||'<div class="empty" style="padding:18px">No screens</div>'}</div>
      </div>
      <div class="wf-preview-column">
        <div class="wf-screen-header"><strong>${esc(sc.name||"Wireframe Preview")}</strong>${isCore?'<span class="wf-core-flag">CORE SCREEN</span>':""}</div>
        <div class="wf-variant-list">${variantButtons}</div>
        <div class="wf-device-wrap">${wireframePreview(sc,p.orientation,variantIndex)}</div>
      </div>
      <div class="wf-detail">
        <div class="detail-box"><h3>Purpose</h3><p>${esc(sc.purpose||"-")}</p></div>
        <div>
          <div class="kicker">Interactions · ${interactions.length}</div>
          ${interactions.map(wfInteractionCard).join("")||'<div class="wf-human-card">-</div>'}
        </div>
        <div>
          <div class="kicker">States · ${states.length}</div>
          <div class="wf-state-grid">${states.map(wfStateCard).join("")||'<div class="wf-human-card">-</div>'}</div>
        </div>
        <div>
          <div class="kicker">Transitions · ${transitions.length}</div>
          ${transitions.map(wfTransitionCard).join("")||'<div class="wf-human-card">-</div>'}
        </div>
        <div class="detail-box"><h3>Feedback</h3>${wfList(sc.feedback||[])}</div>
        <div class="detail-box"><h3>Edge Cases</h3>${wfList(sc.edge_cases||[])}</div>
        <div class="detail-box"><h3>Implementation Notes</h3>${wfList(sc.implementation_notes||[])}</div>
      </div>
    </div>`;
}

function showWireframePack(id,screenIndex=0,section="screens",variantIndex=0){
  const p=wireframePacks.find(x=>x.id===id);
  if(!p) return;
  const screens=Array.isArray(p.screens)?p.screens:[];
  const idx=Math.max(0,Math.min(Math.max(0,screens.length-1),Number(screenIndex)||0));
  const allowed=["screens","rules","handoff","raw"];
  const active=allowed.includes(section)?section:"screens";
  const body=active==="screens"?wfScreensSection(p,id,idx,variantIndex):active==="rules"?wfRulesSection(p):active==="handoff"?wfHandoffSection(p):wfRawSection(p);
  modal(`
    <div class="modal-head">
      <div><div class="kicker">Interaction Wireframe Pack · ${esc(p.version||"v0.1")}</div><h2>${esc(p.title)}</h2></div>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="meta"><span>${esc(p.target_device||"Mobile")}</span><span>${esc(p.orientation||"portrait")}</span><span>${p.screen_count||screens.length} screens</span><span>${p.state_count||0} states</span>${p.core_screen?`<span>Core · ${esc(p.core_screen)}</span>`:""}</div>
    ${wfPackNav(p,id,idx,active,variantIndex)}
    ${body}
    <div class="card-actions" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">닫기</button></div>
  `,true);
}


function implementationHumanState(p){
  const status=String(p?.status||"").toLowerCase();
  const blueprint=String(p?.blueprint_status||"").toLowerCase();
  if(blueprint==="blocked") return {key:"issue",label:"설계 수정 필요",tone:"red",next:"수정 후 다시 설계도 검수"};
  if(status==="blocked") return {key:"issue",label:"설계 문제 확인",tone:"red",next:"구현 설계 상태 확인"};
  if(blueprint==="pending_review") return {key:"review",label:"설계도 검수 대기",tone:"amber",next:"독립 설계도 검수"};
  if(blueprint==="approved" && status==="ready") return {key:"ready",label:"빌드 가능",tone:"green",next:"Build Farm"};
  if(status==="draft" || blueprint==="missing" || !blueprint) return {key:"design",label:"설계 중",tone:"blue",next:"구현 설계도 작성 완료"};
  if(status==="ready" && blueprint==="approved") return {key:"ready",label:"빌드 가능",tone:"green",next:"Build Farm"};
  if(status==="ready") return {key:"review",label:"설계도 검수 대기",tone:"amber",next:"독립 설계도 검수"};
  return {key:"design",label:"설계 중",tone:"blue",next:"구현 설계 상태 확인"};
}
function implementationGameBrief(p){
  const sourceDesign=gameDesigns.find(x=>x.id===p.design_id) || gameDesigns.find(x=>x.idea_id===p.idea_id) || null;
  const sourceIdea=promotedIdeas.find(x=>x.id===p.idea_id) || null;
  return p.one_line || sourceDesign?.one_line || sourceIdea?.one_line || "원본 게임 설명을 불러오는 중입니다.";
}
function implementationContractCard(p){
  const counts=p.category_counts||{};
  const cats=Object.entries(counts).sort((a,b)=>String(a[0]).localeCompare(String(b[0])));
  const human=implementationHumanState(p);
  const brief=implementationGameBrief(p);
  const raw=[p.status?("system: "+p.status):"",p.blueprint_status?("blueprint: "+p.blueprint_status):""].filter(Boolean).join(" · ");
  return '<div class="game-card">'+
    '<div class="card-top"><div><div class="kicker">IMPLEMENTATION BLUEPRINT</div><div class="card-title">'+esc(p.title)+'</div></div><span class="badge '+human.tone+'">'+esc(human.label)+'</span></div>'+
    '<div class="card-desc" style="margin-top:8px">'+esc(brief)+'</div>'+
    '<div class="human-gate" style="margin-top:12px"><b>'+esc(human.label)+'</b><br><span style="color:#a9bdd4">다음 → '+esc(human.next)+'</span></div>'+
    (human.key==="issue" && Array.isArray(p.blueprint_issues) && p.blueprint_issues.length ? '<div class="detail-box" style="margin-top:12px"><h3>검수에서 발견된 문제 · '+p.blueprint_issues.length+'개</h3><p>'+p.blueprint_issues.slice(0,3).map(x=>esc(typeof x==="string"?x:(x?.message||x?.issue||x?.kind||"수정 필요"))).join(" · ")+'</p></div>' : '')+
    '<div class="meta"><span>'+esc(p.version||"v0.1")+'</span><span>'+Number(p.requirement_count||0)+' requirements</span></div>'+
    (cats.length?'<div class="detail-box" style="margin-top:12px"><h3>설계 요구사항</h3><p>'+cats.map(([k,v])=>esc(k)+' '+Number(v)).join(' · ')+'</p></div>':'')+
    (raw?'<div style="margin-top:12px;font-size:10px;color:#5f7794">'+esc(raw)+'</div>':'')+
  '</div>';
}
function implementationHasDownstreamBuild(p){
  return buildJobs.some(b=>b.contract_id===p.id && !isHistoricalBuild(b) && b.status!=="archived");
}
function implementationIsCurrent(p){
  const status=String(p?.status||"").toLowerCase();
  if(["fidelity_pending","repair","qa_ready","playtest_ready"].includes(status)) return false;
  if(implementationHasDownstreamBuild(p)) return false;
  return true;
}
function implementationGroup(p){
  return implementationHumanState(p).key;
}

function isSupersededReview(r){
  return r?.verification_scope==="superseded_reset" || String(r?.review_summary||"").startsWith("SOFT_RESET:");
}
function isHistoricalBuild(b){
  return b?.status==="archived" || String(b?.build_summary||"").startsWith("SOFT_RESET:");
}

function fidelityName(buildId){
  const b=buildJobs.find(x=>x.id===buildId);
  return b?b.title:"Build "+String(buildId||"").slice(0,8);
}
function fidelityReviewCard(r){
  const superseded=isSupersededReview(r);
  const bad=Number(r.partial_count||0)+Number(r.missing_count||0)+Number(r.conflict_count||0)+Number(r.broken_count||0);
  const cls=superseded?"amber":r.verdict==="pass"?"green":r.verdict==="fail"?"red":"blue";
  const badge=superseded?"SUPERSEDED":String(r.verdict||r.status||"pending").toUpperCase();
  const kicker=superseded?"SUPERSEDED HISTORY · ROUND ":"FIDELITY REVIEW · ROUND ";
  return '<div class="game-card"><div class="card-top"><div><div class="kicker">'+kicker+Number(r.review_round||1)+'</div><div class="card-title">'+esc(fidelityName(r.build_job_id))+'</div></div><span class="badge '+cls+'">'+esc(badge)+'</span></div>'+
    '<div class="meta"><span>VERIFIED '+Number(r.verified_count||0)+'</span><span>ISSUES '+bad+'</span>'+(r.reviewed_commit?'<span>'+esc(String(r.reviewed_commit).slice(0,8))+'</span>':'')+'</div>'+
    (superseded?'<div class="human-gate" style="margin-top:12px"><b>과거 검수 기록</b><br>Pre-production reset 이전 결과입니다. 현재 Blueprint 승인·Build·Repair 판단에는 사용하지 않습니다.</div>':'')+
    (r.review_summary?'<div class="detail-box" style="margin-top:12px"><h3>'+(superseded?'Historical Review':'Independent Review')+'</h3><p>'+esc(r.review_summary)+'</p></div>':'')+'</div>';
}
function fidelityPendingCard(b){

function buildCard(p){
  const labels={b0_intake:"B0 · Intake / Setup",b1_architecture:"B1 · Architecture",b2_gameplay:"B2 · Gameplay Systems",b3_screens:"B3 · Full Screen Flow",b4_content:"B4 · MVP Content",b5_integration:"B5 · Full Integration",b6_verification:"B6 · Verification",complete:"Implementation Complete"};
  const brief=implementationGameBrief(p);
  const status=String(p.status||"").toLowerCase();
  const statusLabels={building:"빌드 중",repair:"수리 중",blocked:"문제 확인",fidelity_pending:"설계 검수 대기"};
  const blockers=Array.isArray(p.blockers)?p.blockers:[];
  const tickets=repairTickets.filter(x=>x.build_job_id===p.id && x.status==="open");
  const repairGroups=[...new Set(tickets.map(x=>String(x.repair_group||"")).filter(Boolean))];
  const historical=isHistoricalBuild(p);
  const softReset=String(p.build_summary||"").startsWith("SOFT_RESET:");
  const kicker=historical?"HISTORICAL BUILD · DO NOT REUSE":status==="fidelity_pending"?"GODOT BUILD":"GODOT BUILD JOB";
  const badge=softReset?"SUPERSEDED":(statusLabels[status]||p.status);
  const tone=historical?"amber":status==="fidelity_pending"?"green":status==="repair"||status==="blocked"?"red":"blue";
  return '<div class="game-card"><div class="card-top"><div><div class="kicker">'+kicker+'</div><div class="card-title">'+esc(p.title)+'</div></div><span class="badge '+tone+'">'+esc(badge)+'</span></div>'+
  '<div class="card-desc" style="margin-top:8px">'+esc(brief)+'</div>'+
  '<div class="meta"><span>'+esc(p.build_version||"-")+'</span><span>'+esc(labels[p.current_stage]||p.current_stage||"-")+'</span><span>Godot 4.x</span></div>'+
  '<div class="progress"><i style="width:'+(Number(p.progress)||0)+'%"></i></div><div class="progress-row"><span>설계 요구사항 구현</span><b>'+(Number(p.progress)||0)+'%</b></div>'+
  (status==="repair"?'<div class="human-gate" style="margin-top:12px"><b>Build Repair 진행 대상</b><br>Open repair tickets '+tickets.length+'건'+(repairGroups.length?' · Repair Plan '+repairGroups.length+'그룹':'')+'<br><span style="color:#a9bdd4">다음 → Build Farm 수리 → Static Fidelity 재검수</span></div>':status==="fidelity_pending"?'<div class="human-gate" style="margin-top:12px"><b>Godot 빌드 완료</b><br>Build Farm 시공이 끝났습니다. 독립 설계 검수를 기다리고 있습니다.</div>':softReset?'<div class="human-gate" style="margin-top:12px"><b>과거 구현 보존본</b><br>Pre-production reset 이전 파일입니다. 새 Blueprint의 구현 시작점이나 구현 증거로 재사용하지 않습니다.</div>':p.build_summary?'<div class="detail-box" style="margin-top:12px"><h3>현재 작업</h3><p>'+esc(p.build_summary)+'</p></div>':'')+
  '<div class="meta"><span>'+esc(p.project_path||"-")+'</span>'+(!historical&&p.last_commit?'<span>'+esc(String(p.last_commit).slice(0,8))+'</span>':'')+'</div>'+
  (blockers.length&&!historical?'<div class="human-gate"><b>Blocker</b><br>'+blockers.map(x=>esc(typeof x==="string"?x:JSON.stringify(x))).join("<br>")+'</div>':'')+'</div>';
}
function buildStatusSection(title,desc,tone,items,emptyText){
  return '<div style="margin-top:22px">'+
    '<div class="section-head"><div><h2>'+esc(title)+'</h2><p>'+esc(desc)+'</p></div><span class="badge '+tone+'">'+items.length+'개</span></div>'+
    '<div class="cards">'+(items.map(buildCard).join("") || '<div class="empty">'+esc(emptyText)+'</div>')+'</div>'+

function buildPage(){
  const active=buildJobs.filter(b=>!isHistoricalBuild(b));
  const building=active.filter(b=>String(b.status||"").toLowerCase()==="building");
  const repair=active.filter(b=>String(b.status||"").toLowerCase()==="repair");

    showroom='<div class="pt-empty"><strong>현재 판단 대기 게임이 없습니다.</strong><span>PLAYTEST READY 빌드가 쇼룸에 입고되면 Graybox + 아트 3안과 함께 여기 나타납니다.</span></div>';
  }else{
    const status=playtestStatusMeta(focus);

      const n=playtestOptions(r).filter(x=>playtestArtUrl(r,x)).length;
      return '<button class="'+(r.build_job_id===focus.build_job_id?'active':'')+'" onclick="setPlaytestFocus(\''+esc(r.build_job_id)+'\')"><div class="pt-queue-title">'+esc(r.title)+'</div><div class="pt-queue-meta"><span class="pt-dot '+m.dot+'"></span><span>'+esc(m.label)+'</span><span>·</span><span>ART '+n+'/3</span></div></button>';
    }).join("")+'</div></aside>';

    const art='<div class="pt-art-head"><div><h2>Visual Direction A / B / C</h2><p>KEEP이면 하나를 고르거나 아래 메모에 원하는 방향을 직접 적을 수 있습니다.</p></div><div class="pt-art-count">'+completed+'/3 READY</div></div>'+
      '<div class="pt-art-grid">'+opts.map(o=>{
        const url=playtestArtUrl(focus,o);

        const title=o.title||("Art "+o.id);

          (url?'<img src="'+esc(url)+'" alt="'+esc(title)+'" loading="lazy">':'<div class="pt-art-empty"><i></i><span>'+esc(focus.status==="awaiting_intake"?"입고 대기":"이미지 생성 중")+'</span></div>')+
          '</div><div class="pt-art-copy"><div class="pt-art-row"><span class="pt-art-letter">OPTION '+esc(o.id)+'</span>'+(chosen?'<span class="pt-pill good">SELECTED</span>':url?'<span class="pt-pill good">READY</span>':'<span class="pt-pill warn">PENDING</span>')+'</div><div class="pt-art-title">'+esc(title)+'</div><div class="pt-art-summary">'+esc(summary)+'</div></div></article>';

        '<textarea id="playtestDecisionNote" oninput="setPlaytestNote(\''+esc(focus.id)+'\',this.value)" placeholder="문제 상황, 좋았던 점, 싫었던 점, 원하는 아트 방향 등을 적어두세요.">'+esc(draft.note||"")+'</textarea>'+

        '<div class="pt-route-note">판단 불가 → 빌드 진단실 · KEEP → 게임 고도화실 + AI 아트 제작본부 · MAYBE → 플레이테스트 보류 · KILL → 폐기작 기록실</div></div>'
      : '<div class="pt-verdict"><div class="pt-verdict-head"><div><strong>입고 준비 중</strong><span>A/B/C와 showcase 기록이 준비되면 판단 버튼이 열립니다.</span></div></div></div>';

    const stage='<section class="pt-stage"><div class="pt-hero"><div class="pt-hero-main"><div class="pt-eyebrow">PLAYTEST SHOWROOM</div><div class="pt-title">'+esc(focus.title)+'</div><div class="pt-oneline">'+esc(focus.one_line||focus.build?.build_summary||"설계 검수를 통과한 Graybox playable입니다.")+'</div><div class="pt-status"><span class="pt-pill good">GRAYBOX</span><span class="pt-pill good">FIDELITY PASS</span><span class="pt-pill '+status.cls+'">'+esc(status.label)+'</span></div></div></div>'+

      '<div class="pt-note-card"><h3>입고 상태</h3><p>'+esc(focus.generation_note||"Graybox playable + 3 GPT concept previews; no art applied to build.")+'</p>'+(focus.last_error?'<div class="pt-error">'+esc(focus.last_error)+'</div>':'')+'</div></div>'+art+verdict+'</section>';

  const results='<div class="pt-results"><div class="section-head"><div><h2>처리 결과</h2><p>쇼룸 판단은 사라지지 않고 다음 공간으로 인계된 기록으로 남습니다.</p></div></div><div class="pt-result-grid">'+

  return genericHeader("Playtest Showroom","먼저 플레이 가능한지 확인하고, 그 다음에 게임을 살릴지 판단합니다.")+showroom+results;

    ["분류","왜 죽었는지 패턴화"],
    ["분석","빌드까지 간 실패의 공통점 찾기"],
    ["환류","Idea Lab / Game Design 품질 개선에 재사용"]
  ])+'<div class="ops-grid">'+(cards||'<div class="dept-empty"><b>아직 폐기작 없음</b>KILL된 첫 빌드부터 여기에서 회사의 실패 데이터로 남습니다.</div>')+'</div>';
}

function settingsPage(){
  return genericHeader("스튜디오 설정","가짜 토글 대신 실제 제작 시스템에서 사용하는 기준과 연결 상태만 보여줍니다.")+
    '<div class="settings-real">'+
      '<div class="panel"><div class="panel-title"><strong>Source of Truth</strong><span>production data</span></div><div class="detail-box"><h3>운영 DB</h3><p>Supabase가 현재 큐·상태·판단·인계 기록을 관리합니다.</p></div><div class="settings-value">hmblaasagxyntyfrfztg</div></div>'+
      '<div class="panel"><div class="panel-title"><strong>Project Archive</strong><span>durable files</span></div><div class="detail-box"><h3>게임별 영구 기록</h3><p>게임 하나의 산출물은 GitHub의 projects/&lt;slug&gt;/ 아래에 누적합니다.</p></div><div class="settings-value">Queenrain9/danbi-game-office · main</div></div>'+
      '<div class="panel"><div class="panel-title"><strong>Human Gate</strong><span>playtest policy</span></div><div class="detail-box"><h3>평가 가능성 우선</h3><p>고장난 빌드는 취향 평가하지 않습니다. 판단 불가 → 빌드 진단, KEEP → 고도화 + 아트, KILL → 폐기작 기록으로 보냅니다.</p></div></div>'+
      '<div class="panel"><div class="panel-title"><strong>Showroom Art</strong><span>preview policy</span></div><div class="detail-box"><h3>아트 3안은 방향 탐색용</h3><p>Showroom A/B/C는 실제 Build에 자동 적용하지 않고 선택·메모를 다음 아트 공정의 입력으로 사용합니다.</p></div></div>'+
      '<div class="panel"><div class="panel-title"><strong>Automation</strong><span>scheduled jobs</span></div><div class="detail-box"><h3>예약 작업은 외부 작업 스케줄이 Source of Truth</h3><p>사이트 안의 장식용 ON/OFF 토글은 제거했습니다. 실제 예약 작업의 활성화 여부가 운영 상태입니다.</p></div></div>'+
      '<div class="panel"><div class="panel-title"><strong>Access</strong><span>development phase</span></div><div class="detail-box"><h3>현재 개발 중 공개 접근 구조</h3><p>사이트는 아직 제작 단계라 인증 강화를 우선하지 않습니다. 정식 운영 전 접근 제어를 별도 적용해야 합니다.</p></div></div>'+
    '</div>';
}
function render(){
  const routes=["dashboard","planning","ideas","design","wireframe","implementation","build","fidelity","review","diagnostic","enhancement","art_direction","asset_spec","asset_production","visual_integration","graveyard","activity","settings"];
  if(!routes.includes(current)) current="dashboard";
  navRender();
  const [t,s]=titleInfo();
  document.getElementById("pageTitle").textContent=t;
  const sub=document.getElementById("pageSubtitle");
  sub.textContent=s;
  sub.style.display=s?"":"none";
  const topActions=document.querySelector(".top-actions");
  if(current==="ideas") topActions.innerHTML='<button class="btn ghost" title="아이디어는 매시간 자동 생성됩니다. 사이트 직접 실행은 아직 연결 전입니다." onclick="ideaRunUnavailable()">지금 생성</button><button class="btn ghost" title="새로고침" onclick="loadPromotedIdeas(true)">↻</button>';
  else if(["review","diagnostic","enhancement","art_direction","asset_spec","asset_production","visual_integration","graveyard"].includes(current)) topActions.innerHTML='<button class="btn ghost" onclick="Promise.all([loadPlaytestShowcase(false),loadPostPlaytest(false)]).then(()=>toast(\'새로고침 완료\'))">↻ 새로고침</button>';
  else topActions.innerHTML="";
  const pages={
    dashboard,planning:planningDashboard,ideas:ideasPage,design:designPage,wireframe:wirePage,
    implementation:implementationPage,build:buildPage,fidelity:fidelityPage,review:reviewPage,
    diagnostic:diagnosticPage,enhancement:enhancementPage,art_direction:artDirectionPage,
    asset_spec:assetSpecPage,asset_production:assetProductionPage,visual_integration:visualIntegrationPage,
    graveyard:graveyardPage,activity:activityPage,settings:settingsPage
  };
  document.getElementById("content").innerHTML=pages[current]();
}
function getP(id){ return state.projects.find(p=>p.id===id); }
function promote(id,stage){
  const p=getP(id); if(!p)return;
  p.stage=stage; p.progress=stage==="design"?20:stage==="wireframe"?100:stage==="build"?15:p.progress;
  if(stage==="build"){ p.repo=p.repo||`danbi-lab/${slugify(p.title)}`; p.build=p.build||"v0.0.1"; }
  addLog(`${p.title} → ${STAGE_LABEL[stage]} 단계로 이동했습니다.`); save(); render(); toast(`${STAGE_LABEL[stage]}로 이동`);
}
function advanceProgress(id,amount,nextStage){
  const p=getP(id); if(!p)return; p.progress=Math.min(100,(p.progress||0)+amount);
  addLog(`${p.title} ${STAGE_LABEL[p.stage]} 진행률 ${p.progress}%.`);
  if(p.progress>=100 && nextStage){
    p.stage=nextStage;
    if(nextStage==="wireframe"){p.progress=100;p.screens=p.screens||8;}
    if(nextStage==="playtest"){p.progress=100;p.build=p.build||"v0.1.0";p.changes="자동 제작된 핵심 루프가 플레이 가능한 상태입니다.";}
    addLog(`${p.title} → ${STAGE_LABEL[nextStage]} 완료.`);
  }
  save(); render();
}
function decide(id,d){
  const p=getP(id); if(!p)return; p.decision=d;
  if(d==="KEEP"){ p.stage="directed"; p.note=p.note||"첫 플레이테스트 완료. 대표 디렉팅 대기."; addLog(`${p.title}: KEEP. Directed Development로 전환했습니다.`); }
  else if(d==="MAYBE"){ addLog(`${p.title}: MAYBE. Review Room에 보류했습니다.`); }
  else { p.stage="archive"; addLog(`${p.title}: KILL. Archive로 이동했습니다.`); }
  save(); render(); toast(`${p.title} · ${d}`);
}
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9가-힣]+/g,"-").replace(/^-|-$/g,""); }

function showProject(id){
  const p=getP(id); if(!p)return;
  modal(`<div class="modal-head"><div><div class="kicker">${STAGE_LABEL[p.stage]}</div><h2>${esc(p.title)}</h2></div><button class="close" onclick="closeModal()">×</button></div>
  <div class="two-col"><div class="detail-box"><h3>Game Brief</h3><p>${esc(p.desc)}</p><p><b>Genre</b> · ${esc(p.genre)}<br><b>Platform</b> · ${esc(p.platform)}<br><b>Risk</b> · ${esc(p.risk)}<br><b>Visual</b> · ${esc(p.visual||"-")}</p></div>
  <div class="detail-box"><h3>Production State</h3><p><b>Stage</b> · ${STAGE_LABEL[p.stage]}<br><b>Progress</b> · ${p.progress||0}%<br><b>Build</b> · ${esc(p.build||"not built")}<br><b>Repo</b> · ${esc(p.repo||"not assigned")}</p></div></div>
  ${p.note?`<div class="detail-box" style="margin-top:12px"><h3>Danbi Direction</h3><p>${esc(p.note)}</p></div>`:""}
  <div class="card-actions" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">닫기</button></div>`);
}
function editDirection(id){
  const p=getP(id); if(!p)return;
  modal(`<div class="modal-head"><div><div class="kicker">Directed Development</div><h2>${esc(p.title)}</h2></div><button class="close" onclick="closeModal()">×</button></div>
    <label>단비 디렉팅 메모</label><textarea id="directionText">${esc(p.note||"")}</textarea>
    <div class="human-gate">이 메모가 저장된 이후 AI는 이 방향을 기준으로 제안·구현해야 하며 핵심 게임 디자인을 임의 변경하지 않습니다.</div>
    <div class="card-actions" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveDirection('${p.id}')">저장</button></div>`);
}
function saveDirection(id){ const p=getP(id); p.note=document.getElementById("directionText").value.trim(); addLog(`${p.title}에 대표 디렉팅 메모가 업데이트되었습니다.`); save(); closeModal(); render(); toast("디렉팅 메모 저장"); }
function copyRepo(id){ const p=getP(id); if(!p||!p.repo){toast("Repo가 아직 없습니다.");return;} navigator.clipboard?.writeText("https://github.com/"+p.repo).then(()=>toast("Repo 주소 복사됨")).catch(()=>toast(p.repo)); }
function modal(inner,wide=false){ const el=document.getElementById("modal"); el.className=wide?"modal wide":"modal"; el.innerHTML=inner; document.getElementById("modalBackdrop").classList.add("show"); }
function closeModal(){ document.getElementById("modalBackdrop").classList.remove("show"); }
function backdropClose(e){ if(e.target.id==="modalBackdrop")closeModal(); }
function toggleSetting(k){ state.settings[k]=!state.settings[k]; addLog(`Studio Policy: ${k} = ${state.settings[k]?"ON":"OFF"}`); save(); render(); }
function clearLog(){ if(confirm("활동 로그를 비울까요?")){state.activity=[];save();render();} }
function resetStudio(){ if(confirm("로컬 상태를 비울까요?")){state=seedState();save();render();toast("초기화 완료");} }
function toggleMenu(){ document.getElementById("sidebar").classList.toggle("open"); }
window.addEventListener("hashchange",()=>{current=(location.hash||"#dashboard").slice(1);render();});
render();
initCloud();
</script>
