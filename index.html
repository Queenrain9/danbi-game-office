    .score span { font-size:9px; color:#6e86a3; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; }

    }
  </style>
</head>

</div>

const CLOUD_URL = "https://hmblaasagxyntyfrfztg.supabase.co/functions/v1/danbi-game-office-sync";
let cloudReady = false;
let cloudTimer = null;
let ideaPollTimer = null;
let promotedIdeas = [];
let state = load();
let current = (location.hash || "#dashboard").slice(1);

function load(){ try{ return JSON.parse(localStorage.getItem("danbiGameOfficeV1")) || seedState(); }catch(e){ return seedState(); } }

function save(){
  localStorage.setItem("danbiGameOfficeV1", JSON.stringify(state));
  queueCloudSave();
}

function getCloudKey(){ return localStorage.getItem("danbiGameOfficeKey") || ""; }

function setCloudStatus(text, ok=false){
  const el=document.getElementById("cloudStatus");
  if(!el) return;
  el.textContent=text;
  el.style.color=ok?"#75dcb9":"#9bc0ff";
}

function resetCloudKey(){
  const next=prompt("이 기기에서 사용할 DANBI GAME OFFICE 연결키를 입력해주세요.", getCloudKey());
  if(next===null) return;
  const value=next.trim();
  if(!value) return;
  localStorage.setItem("danbiGameOfficeKey", value);
  cloudReady=false;
  initCloud();
}

async function cloudRequest(method, body){
  const key=getCloudKey();
  if(!key) throw new Error("cloud_key_missing");
  const res=await fetch(CLOUD_URL,{
    method,
    headers:{"Content-Type":"application/json","X-Office-Key":key},
    body: body ? JSON.stringify(body) : undefined,
    cache:"no-store"
  });
  if(!res.ok) {
    const payload=await res.json().catch(()=>({}));
    throw new Error(payload.error || ("HTTP "+res.status));
  }
  return res.json();
}

async function loadPromotedIdeas(showToast=false){
  const key=getCloudKey();
  if(!key) return;
  try{
    const res=await fetch(CLOUD_URL+"?view=ideas&limit=50",{
      method:"GET",
      headers:{"Content-Type":"application/json","X-Office-Key":key},
      cache:"no-store"
    });
    if(!res.ok){
      const payload=await res.json().catch(()=>({}));
      throw new Error(payload.error || ("HTTP "+res.status));
    }
    const payload=await res.json();
    promotedIdeas=Array.isArray(payload.ideas)?payload.ideas:[];
    if(current==="ideas" || current==="dashboard") render();
    if(showToast) toast(`Idea Lab 새로고침 · ${promotedIdeas.length}개`);
  }catch(err){
    console.error("Idea Lab load failed",err);
    if(showToast) toast("Idea Lab 불러오기 실패");
  }
}

function startIdeaPolling(){
  clearInterval(ideaPollTimer);
  ideaPollTimer=setInterval(()=>loadPromotedIdeas(false),60000);
}

async function initCloud(){
  let key=getCloudKey();
  if(!key){
    key=(prompt("어디서든 같은 회사 상태를 쓰려면 DANBI GAME OFFICE 연결키를 입력해주세요.\n이 기기에서 한 번만 입력하면 됩니다.")||"").trim();
    if(!key){ setCloudStatus("☁ Cloud 미연결"); return; }
    localStorage.setItem("danbiGameOfficeKey", key);
  }

  setCloudStatus("☁ Cloud 동기화 중…");
  try{
    const remote=await cloudRequest("GET");
    if(remote && remote.state){
      state=remote.state;
      localStorage.setItem("danbiGameOfficeV1", JSON.stringify(state));
    }else{
      await cloudRequest("POST",{state});
    }
    cloudReady=true;
    await loadPromotedIdeas(false);
    startIdeaPolling();
    setCloudStatus("☁ Cloud synced", true);
    render();
  }catch(err){
    cloudReady=false;
    setCloudStatus(err.message==="unauthorized"?"☁ 연결키 확인 필요":"☁ Cloud 연결 오류");
    console.error("Cloud sync failed",err);
  }
}

function queueCloudSave(){
  if(!cloudReady) return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(cloudSave,450);
}

async function cloudSave(){
  try{
    setCloudStatus("☁ 저장 중…");
    await cloudRequest("POST",{state});
    setCloudStatus("☁ Cloud synced", true);
  }catch(err){
    setCloudStatus("☁ 저장 실패");
    console.error("Cloud save failed",err);
  }
}

function conceptPage(){ const ps=state.projects.filter(p=>p.stage==="concept"); return genericHeader("Concept Studio","기획안과 여러 컨셉 후보를 만들고 AI Art Director가 대표 방향을 선택합니다.")+`<div class="cards">${ps.map(conceptCard).join("") || `<div class="empty">현재 컨셉 제작 중인 프로젝트가 없습니다.</div>`}</div>`; }
function wireCard(p){
  return `<div class="game-card">
    <div class="card-top"><div><div class="kicker">Implementation-ready</div><div class="card-title">${esc(p.title)}</div></div><span class="badge green">WIREFRAME</span></div>
    <div class="card-desc">${esc(p.desc)}</div>
    <div class="detail-box"><h3>${p.screens||8} Screens</h3><p>Layout · Components · Interaction · State · Transition · Game Rules</p></div>
    <div class="progress"><i style="width:${p.progress}%"></i></div><div class="progress-row"><span>Pre-production package</span><b>${p.progress}%</b></div>
    <div class="card-actions"><button class="btn primary" onclick="promote('${p.id}','build')">Build Farm으로 보내기</button><button class="btn ghost" onclick="showProject('${p.id}')">설계서</button></div>
  </div>`;
}
function wirePage(){ const ps=state.projects.filter(p=>p.stage==="wireframe"); return genericHeader("Wireframe Department","예쁜 이미지를 실제 구현 구조와 상태·인터랙션으로 번역합니다.")+`<div class="cards">${ps.map(wireCard).join("") || `<div class="empty">Wireframe-ready 프로젝트가 없습니다.</div>`}</div>`; }
function buildCard(p){
  return `<div class="game-card">
    <div class="card-top"><div><div class="kicker">Godot build farm</div><div class="card-title">${esc(p.title)}</div></div><span class="badge blue">${p.build||"v0.0.1"}</span></div>
    <div class="card-desc">${esc(p.desc)}</div>
    <div class="meta"><span>Godot</span><span>${esc(p.repo||"repo pending")}</span><span>Greybox</span></div>
    <div class="progress"><i style="width:${p.progress}%"></i></div><div class="progress-row"><span>Playable prototype</span><b>${p.progress}%</b></div>
    <div class="card-actions"><button class="btn" onclick="advanceProgress('${p.id}',25,'playtest')">빌드 진행 +25%</button><button class="btn ghost" onclick="showProject('${p.id}')">상세</button></div>
  </div>`;
}
function buildPage(){ const ps=state.projects.filter(p=>p.stage==="build"); return genericHeader("Build Farm","완성품이 아니라 '재미를 판단할 수 있는 플레이어블'을 빠르게 만듭니다.")+`<div class="cards">${ps.map(buildCard).join("") || `<div class="empty">현재 Build Farm이 비어 있습니다.</div>`}</div>`; }
function reviewCard(p,compact=false){
  return `<div class="game-card review-card">
    <div class="card-top"><div><div class="kicker">Ready for playtest</div><div class="card-title">${esc(p.title)}</div></div><span class="badge green">${esc(p.build||"prototype")}</span></div>
    <div class="card-desc">${esc(p.desc)}</div>
    <div class="meta"><span>${esc(p.genre)}</span><span>Godot</span><span>${esc(p.repo||"repo pending")}</span></div>
    ${p.changes?`<div class="detail-box"><h3>최근 변경사항</h3><p>${esc(p.changes)}</p></div>`:""}
    <div class="decision">
      <button class="btn good" onclick="decide('${p.id}','KEEP')">♥ KEEP</button>
      <button class="btn warn" onclick="decide('${p.id}','MAYBE')">? MAYBE</button>
      <button class="btn bad" onclick="decide('${p.id}','KILL')">× KILL</button>
    </div>
    <div class="card-actions"><button class="btn" onclick="copyRepo('${p.id}')">Repo 주소 복사</button><button class="btn ghost" onclick="showProject('${p.id}')">상세</button></div>
  </div>`;
}
function reviewPage(){ const ps=state.projects.filter(p=>p.stage==="playtest"); return genericHeader("Ready for Playtest","대표가 가장 자주 들어오는 방입니다. 이 단계부터 자동화가 급격히 줄어듭니다.")+`<div class="cards">${ps.map(p=>reviewCard(p)).join("") || `<div class="empty">🎉 현재 대표 승인 대기 게임이 없습니다.</div>`}</div>`; }
function directedCard(p){
  return `<div class="game-card">
    <div class="card-top"><div><div class="kicker">Human-directed</div><div class="card-title">${esc(p.title)}</div></div><span class="badge purple">${esc(p.decision||"KEEP")}</span></div>
    <div class="card-desc">${esc(p.desc)}</div>
    <div class="automation-meter"><div class="meter-row"><span>Automation level</span><b>20%</b></div><div class="meter"><i style="width:20%;background:linear-gradient(90deg,#9f83df,#6b79d0)"></i></div></div>
    <div class="detail-box"><h3>Danbi Direction</h3><p>${esc(p.note||"아직 대표 지시가 없습니다.")}</p></div>
    <div class="card-actions"><button class="btn primary" onclick="editDirection('${p.id}')">디렉팅 메모</button><button class="btn" onclick="showProject('${p.id}')">프로젝트 룸</button></div>
  </div>`;
}
function directedPage(){ const ps=state.projects.filter(p=>p.stage==="directed"); return genericHeader("Directed Development","이 단계에서는 AI가 핵심 방향을 임의로 바꾸지 않습니다.")+`<div class="cards">${ps.map(directedCard).join("")}</div>`; }
function archivePage(){ const ps=state.projects.filter(p=>p.stage==="archive"); return genericHeader("Archive","버린 아이디어도 기록은 남습니다. 실패를 싸게 만드는 것이 이 공장의 장점입니다.")+`<div class="cards">${ps.map(p=>`<div class="game-card"><div class="card-title">${esc(p.title)}</div><div class="card-desc">${esc(p.desc)}</div><div class="meta"><span>${esc(p.decision||"ARCHIVED")}</span><span>${esc(p.genre)}</span></div><div class="card-actions"><span class="badge">ARCHIVED</span></div></div>`).join("") || `<div class="empty">Archive가 비어 있습니다.</div>`}</div>`; }
function activityPage(){ return genericHeader("Studio Activity","자동 생성·승격·빌드와 대표 결정이 모두 기록됩니다.",`<button class="btn bad" onclick="clearLog()">로그 비우기</button>`)+`<div class="panel">${activityList(80)}</div>`; }
function settingsPage(){
  const rows=[
    ["autoConcept","Concept 자동 제작","기획안과 컨셉 후보군을 생성합니다."],
    ["autoWireframe","Wireframe 자동 제작","선정된 컨셉을 구현용 화면 설계도로 번역합니다."],
    ["autoBuild","Godot Build 자동화","Wireframe-ready 프로젝트를 greybox prototype으로 보냅니다."],
    ["humanGate","Playtest 이후 Human Gate","KEEP 이후 핵심 방향 변경은 대표 승인 없이는 진행하지 않습니다."]
  ];
  return genericHeader("Studio Policy","자율 제작의 범위를 정합니다.")+`
  <div class="two-col">
    <div class="panel"><div class="panel-title"><strong>Automation</strong><span>scheduled + local</span></div>
      <div class="detail-box" style="margin-bottom:12px"><h3>Idea Lab intake</h3><p>아이디어 연구소는 ChatGPT 예약 작업의 심사를 통과해 Supabase에 저장된 후보만 표시합니다. 브라우저의 샘플 생성 기능은 사용하지 않습니다.</p></div>
      ${rows.map(([k,t,d])=>`<div class="switch-row"><div><strong>${t}</strong><span>${d}</span></div><button class="switch ${state.settings[k]?"on":""}" onclick="toggleSetting('${k}')"><i></i></button></div>`).join("")}
    </div>
    <div class="panel"><div class="panel-title"><strong>Studio Principle</strong><span>v0.1</span></div>
      <div class="detail-box"><h3>Human-directed, AI-produced</h3><p>AI는 후보를 많이 만들고 싸게 실패합니다. 대표는 제품 가치 판단, 플레이 감각, 미감, 범위 결정을 담당합니다.</p></div>
      <div class="human-gate" style="margin-top:12px">핵심 KPI: <b>“일주일에 대표가 플레이할 가치가 있는 게임이 몇 개 Review Room에 도착하는가.”</b></div>
      <div style="margin-top:16px"><button class="btn bad" onclick="resetStudio()">샘플 데이터로 초기화</button></div>
    </div>
  </div>`;
}
function render(){
  if(!["dashboard","ideas","greenlight","concept","wireframe","build","review","directed","archive","activity","settings"].includes(current)) current="dashboard";
  navRender();
  const [t,s]=titleInfo(); document.getElementById("pageTitle").textContent=t; document.getElementById("pageSubtitle").textContent=s;
  const cycleBtn=document.getElementById("studioCycleBtn");
  if(cycleBtn) cycleBtn.style.display=current==="ideas"?"none":"inline-flex";
  const pages={dashboard,ideas:ideasPage,greenlight:greenlightPage,concept:conceptPage,wireframe:wirePage,build:buildPage,review:reviewPage,directed:directedPage,archive:archivePage,activity:activityPage,settings:settingsPage};
  document.getElementById("content").innerHTML = pages[current]();
}
function getP(id){ return state.projects.find(p=>p.id===id); }
function promote(id,stage){
  const p=getP(id); if(!p)return;
  p.stage=stage; p.progress=stage==="concept"?20:stage==="wireframe"?100:stage==="build"?15:p.progress;
  if(stage==="build"){ p.repo=p.repo||`danbi-lab/${slugify(p.title)}`; p.build=p.build||"v0.0.1"; }
  addLog(`${p.title} → ${STAGE_LABEL[stage]} 단계로 이동했습니다.`); save(); render(); toast(`${STAGE_LABEL[stage]}로 이동`);
}
function hold(id){ const p=getP(id); if(!p)return; addLog(`${p.title} Greenlight 심사를 HOLD했습니다.`); toast("HOLD 기록됨"); }
function kill(id){ const p=getP(id); if(!p)return; p.stage="archive"; p.decision="REJECT"; addLog(`${p.title}를 Greenlight에서 REJECT하고 Archive로 보냈습니다.`); save(); render(); }
function advanceProgress(id,amount,nextStage){
  const p=getP(id); if(!p)return; p.progress=Math.min(100,(p.progress||0)+amount);
  addLog(`${p.title} ${STAGE_LABEL[p.stage]} 진행률 ${p.progress}%.`);
  if(p.progress>=100 && nextStage){
    p.stage=nextStage;
    if(nextStage==="wireframe"){p.progress=100;p.screens=p.screens||8;}
    if(nextStage==="playtest"){p.progress=100;p.build=p.build||"v0.1.0";p.changes="자동 제작된 핵심 루프가 플레이 가능한 상태입니다.";}
    addLog(`${p.title} → ${STAGE_LABEL[nextStage]} 완료.`);
  }
  save(); render();
}
function decide(id,d){
  const p=getP(id); if(!p)return; p.decision=d;
  if(d==="KEEP"){ p.stage="directed"; p.note=p.note||"첫 플레이테스트 완료. 대표 디렉팅 대기."; addLog(`${p.title}: KEEP. Directed Development로 전환했습니다.`); }
  else if(d==="MAYBE"){ addLog(`${p.title}: MAYBE. Review Room에 보류했습니다.`); }
  else { p.stage="archive"; addLog(`${p.title}: KILL. Archive로 이동했습니다.`); }
  save(); render(); toast(`${p.title} · ${d}`);
}
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9가-힣]+/g,"-").replace(/^-|-$/g,""); }
function runStudioCycle(){
  state.cycle++;
  let actions=[];
  if(state.settings.autoConcept){
    const g=state.projects.find(p=>p.stage==="greenlight");
    if(g && avgScore(g)>=80){g.stage="concept";g.progress=25;g.conceptCount=4;actions.push(`${g.title} Concept 시작`);}
  }
  if(state.settings.autoWireframe){
    const c=state.projects.find(p=>p.stage==="concept");
    if(c){c.progress=Math.min(100,(c.progress||0)+25);if(c.progress>=100){c.stage="wireframe";c.screens=c.screens||8;actions.push(`${c.title} Wireframe 완료`);}}
  }
  if(state.settings.autoBuild){
    const w=state.projects.find(p=>p.stage==="wireframe");
    if(w){w.stage="build";w.progress=20;w.repo=w.repo||`danbi-lab/${slugify(w.title)}`;w.build="v0.0.1";actions.push(`${w.title} Build Farm 진입`);}
    const b=state.projects.find(p=>p.stage==="build");
    if(b){b.progress=Math.min(100,(b.progress||0)+22);if(b.progress>=100){b.stage="playtest";b.build="v0.1.0";b.changes="AI 제작본부가 핵심 루프의 playable greybox를 완성했습니다.";actions.push(`${b.title} Playtest ready`);}}
  }
  const summary=`Studio Cycle #${state.cycle}: ${actions.join(" · ") || "자동화된 작업 없음"}`;
  addLog(summary); save(); render(); toast(`Cycle #${state.cycle} 완료`);
}
function avgScore(p){ const s=p.scores||{hook:80,feasibility:80,replay:80,visual:80}; return (s.hook+s.feasibility+s.replay+s.visual)/4; }
function showProject(id){
  const p=getP(id); if(!p)return;
  modal(`<div class="modal-head"><div><div class="kicker">${STAGE_LABEL[p.stage]}</div><h2>${esc(p.title)}</h2></div><button class="close" onclick="closeModal()">×</button></div>
  <div class="two-col"><div class="detail-box"><h3>Game Brief</h3><p>${esc(p.desc)}</p><p><b>Genre</b> · ${esc(p.genre)}<br><b>Platform</b> · ${esc(p.platform)}<br><b>Risk</b> · ${esc(p.risk)}<br><b>Visual</b> · ${esc(p.visual||"-")}</p></div>
  <div class="detail-box"><h3>Production State</h3><p><b>Stage</b> · ${STAGE_LABEL[p.stage]}<br><b>Progress</b> · ${p.progress||0}%<br><b>Build</b> · ${esc(p.build||"not built")}<br><b>Repo</b> · ${esc(p.repo||"not assigned")}</p></div></div>
  ${p.note?`<div class="detail-box" style="margin-top:12px"><h3>Danbi Direction</h3><p>${esc(p.note)}</p></div>`:""}
  <div class="card-actions" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">닫기</button></div>`);
}
function editDirection(id){
  const p=getP(id); if(!p)return;
  modal(`<div class="modal-head"><div><div class="kicker">Directed Development</div><h2>${esc(p.title)}</h2></div><button class="close" onclick="closeModal()">×</button></div>
    <label>단비 디렉팅 메모</label><textarea id="directionText">${esc(p.note||"")}</textarea>
    <div class="human-gate">이 메모가 저장된 이후 AI는 이 방향을 기준으로 제안·구현해야 하며 핵심 게임 디자인을 임의 변경하지 않습니다.</div>
    <div class="card-actions" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveDirection('${p.id}')">저장</button></div>`);
}
function saveDirection(id){ const p=getP(id); p.note=document.getElementById("directionText").value.trim(); addLog(`${p.title}에 대표 디렉팅 메모가 업데이트되었습니다.`); save(); closeModal(); render(); toast("디렉팅 메모 저장"); }
function copyRepo(id){ const p=getP(id); if(!p||!p.repo){toast("Repo가 아직 없습니다.");return;} navigator.clipboard?.writeText("https://github.com/"+p.repo).then(()=>toast("Repo 주소 복사됨")).catch(()=>toast(p.repo)); }
function modal(inner){ document.getElementById("modal").innerHTML=inner; document.getElementById("modalBackdrop").classList.add("show"); }
function closeModal(){ document.getElementById("modalBackdrop").classList.remove("show"); }
function backdropClose(e){ if(e.target.id==="modalBackdrop")closeModal(); }
function toggleSetting(k){ state.settings[k]=!state.settings[k]; addLog(`Studio Policy: ${k} = ${state.settings[k]?"ON":"OFF"}`); save(); render(); }
function clearLog(){ if(confirm("활동 로그를 비울까요?")){state.activity=[];save();render();} }
function resetStudio(){ if(confirm("로컬 데이터를 초기 샘플 상태로 되돌릴까요?")){state=seedState();save();render();toast("초기화 완료");} }
function toggleMenu(){ document.getElementById("sidebar").classList.toggle("open"); }
window.addEventListener("hashchange",()=>{current=(location.hash||"#dashboard").slice(1);render();});
render();
initCloud();
</script>
</body>
</html>
