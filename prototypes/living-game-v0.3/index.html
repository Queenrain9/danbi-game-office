<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Living Game v0.3 — Game Invention Prototype</title>
<style>
:root{--bg:#07090d;--panel:#0f1218;--text:#f5f6f1;--muted:#8e95a5;--accent:#d9f56e;--line:rgba(255,255,255,.11)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}.app{min-height:100vh;display:grid;place-items:center;padding:18px}.shell{width:min(1120px,100%);min-height:720px;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:rgba(8,10,14,.97);box-shadow:0 30px 120px rgba(0,0,0,.5)}
.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line)}.brand{font-size:12px;font-weight:900;letter-spacing:.16em}.brand b{color:var(--accent)}
button{font:inherit}.ghost{border:1px solid var(--line);background:transparent;color:#aeb4c1;border-radius:999px;padding:9px 13px;cursor:pointer}
main{padding:26px}.hero{min-height:590px;display:flex;flex-direction:column;justify-content:center;max-width:800px;margin:auto}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:13px}
h1{font-size:clamp(44px,8vw,88px);line-height:.92;letter-spacing:-.06em;margin:0 0 22px}h2{font-size:clamp(30px,5vw,58px);line-height:1;letter-spacing:-.05em;margin:0 0 16px}h3{letter-spacing:-.02em}p{line-height:1.68;color:var(--muted)}
.actions{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin-top:30px}.primary,.secondary{border-radius:18px;padding:21px 22px;text-align:left;cursor:pointer}.primary{border:0;background:var(--accent);color:#0d1009;font-weight:900}.secondary{border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--text);font-weight:800}.meta{font-size:12px;font-weight:500;opacity:.62;margin-top:7px}
.workbench{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px}.stage{position:relative;min-height:610px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#080a0f;touch-action:none;user-select:none}.stage canvas{display:block;width:100%;height:610px}
.hud{position:absolute;left:16px;right:16px;top:15px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{padding:8px 10px;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:rgba(4,6,10,.62);backdrop-filter:blur(8px);font-size:10px;color:#aab0bd}.live{color:var(--accent)}.live:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);margin-right:6px;animation:p 1.2s infinite}@keyframes p{50%{opacity:.28}}
.side{border:1px solid var(--line);border-radius:24px;padding:20px;background:rgba(255,255,255,.02);display:flex;flex-direction:column;min-height:610px}.side h3{font-size:24px;line-height:1.08;margin:2px 0 12px}.thought{margin:16px 0;padding:14px;border:1px solid rgba(216,245,110,.14);border-radius:15px;background:rgba(216,245,110,.035);font-size:12px;color:#aab1be;line-height:1.6}.stack{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:10px;border-radius:999px;padding:6px 8px;background:rgba(255,255,255,.045);color:#a8afbc;border:1px solid rgba(255,255,255,.06)}.chip.on{color:var(--accent);border-color:rgba(216,245,110,.2);background:rgba(216,245,110,.055)}.log{margin-top:16px;display:grid;gap:8px;font-size:11px;color:#757d8d}.log-item{padding-left:10px;border-left:1px solid rgba(255,255,255,.1);line-height:1.45}.footnote{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);font-size:11px;line-height:1.55;color:#707888}
.crystal{max-width:980px;margin:10px auto}.lock{display:inline-flex;align-items:center;gap:7px;border-radius:999px;border:1px solid rgba(216,245,110,.25);background:rgba(216,245,110,.05);padding:8px 10px;color:var(--accent);font-size:10px;font-weight:900}.spec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.spec{border:1px solid var(--line);border-radius:16px;padding:16px;background:rgba(255,255,255,.02)}.spec b{display:block;margin-bottom:6px}.spec span{font-size:12px;line-height:1.5;color:#9198a8}
.art-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.art-card{overflow:hidden;border:1px solid var(--line);border-radius:22px;background:#0d1016;color:var(--text);cursor:pointer;text-align:left;transition:.18s}.art-card:hover{transform:translateY(-4px);border-color:rgba(216,245,110,.5)}.preview{height:220px;position:relative;overflow:hidden}.preview .shape{position:absolute;left:42%;top:42%;width:58px;height:34px;border-radius:50% 55% 45% 52%;transform:rotate(-9deg)}.preview .sat{position:absolute;right:26%;top:28%;width:18px;height:18px;border-radius:50%}
.neon{background:radial-gradient(circle at 72% 35%,rgba(62,80,180,.65),transparent 18%),linear-gradient(150deg,#070711,#191046 55%,#07131b)}.neon .shape{background:#e9ff77;box-shadow:0 0 38px #b8ff5a}.neon .sat{background:#ff4eb9;box-shadow:0 0 24px #ff4eb9}
.ink{background:linear-gradient(145deg,#e7ddc7,#c8b393)}.ink .shape{background:#27231e;box-shadow:9px 10px 0 rgba(65,48,35,.12)}.ink .sat{background:#a44e3d}
.machine{background:linear-gradient(145deg,#10161b,#202b31)}.machine:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 40px,rgba(255,255,255,.035) 41px 42px)}.machine .shape{background:#cbd4d9;box-shadow:0 0 22px rgba(150,205,230,.35)}.machine .sat{background:#f0a55a;box-shadow:0 0 18px rgba(240,165,90,.5)}
.art-body{padding:16px}.art-body h3{font-size:19px;margin:0 0 5px}.art-body p{font-size:12px;margin:0}
.play{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}.play-stage{position:relative;min-height:600px;border:1px solid var(--line);border-radius:23px;overflow:hidden;background:#080a0e}.play-stage canvas{display:block;width:100%;height:600px;touch-action:none}.play-side{border:1px solid var(--line);border-radius:23px;padding:20px;background:rgba(255,255,255,.02)}.score{font-size:48px;font-weight:900;letter-spacing:-.055em}.objective{padding:13px;border-radius:14px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.025);font-size:12px;line-height:1.55;color:#a7aebb}.pack{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}.game-card{border:1px solid var(--line);border-radius:18px;padding:18px;background:rgba(255,255,255,.024);color:var(--text);cursor:pointer;text-align:left}.game-card h3{font-size:22px;margin:4px 0 8px}.small{font-size:11px;color:#767e8d;line-height:1.55}
@media(max-width:820px){.app{padding:0}.shell{min-height:100vh;border:0;border-radius:0}.top{height:58px}main{padding:16px}.actions,.workbench,.spec-grid,.art-grid,.play,.pack{grid-template-columns:1fr}.stage,.side{min-height:auto}.stage canvas{height:520px}.side{min-height:220px}.preview{height:150px}.play-stage canvas{height:520px}}
</style>
</head>
<body><div class="app"><div class="shell"><div class="top"><div class="brand">LIVING <b>GAME</b> / v0.3</div><button class="ghost" id="homeBtn">처음으로</button></div><main id="root"></main></div></div>
<script>
const root=document.getElementById("root"), STORE="living_game_pack_v03";
document.getElementById("homeBtn").onclick=home;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>crypto?.randomUUID?.()||("g-"+Date.now()+"-"+Math.random().toString(36).slice(2));
function loadPack(){try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch{return[]}}
function savePack(v){localStorage.setItem(STORE,JSON.stringify(v))}
let s=null,raf=0,gameRaf=0;

const MUTATIONS=[
 {id:"trail",kind:"system",label:"흔적",requires:w=>!w.systems.includes("trail"),score:m=>m.distance*1.4+m.curve*1.8},
 {id:"inertia",kind:"control",label:"관성",requires:w=>w.control==="direct",score:m=>m.fast*2+m.distance*.7},
 {id:"target",kind:"entity",label:"움직이는 타깃",requires:w=>!w.entities.includes("target"),score:m=>m.fast*1.6+m.taps*.25+m.distance*.5},
 {id:"collect",kind:"system",label:"수집",requires:w=>!w.systems.includes("collect"),score:m=>m.edge*.7+m.distance*.5+m.taps*.2},
 {id:"companion",kind:"entity",label:"동행자",requires:w=>!w.entities.includes("companion"),score:m=>m.idle*.45+m.proximity*1.1+m.slow*.6},
 {id:"hazards",kind:"entity",label:"위험지형",requires:w=>!w.entities.includes("hazards"),score:m=>m.fast*1.3+m.edge*.55+m.retries*.8},
 {id:"depth",kind:"space",label:"입체감",requires:w=>w.space==="flat",score:m=>m.edge*.9+m.curve*.8+m.distance*.5},
 {id:"base",kind:"entity",label:"거점",requires:w=>!w.entities.includes("base")&&w.systems.includes("collect"),score:m=>m.collects*1.8+m.returns*1.4+.3},
 {id:"resource",kind:"system",label:"자원",requires:w=>!w.systems.includes("resource")&&(w.systems.includes("collect")||w.entities.includes("base")),score:m=>m.collects*1.5+m.taps*.25+.4},
 {id:"upgrade",kind:"system",label:"업그레이드",requires:w=>!w.systems.includes("upgrade")&&w.systems.includes("resource"),score:m=>m.returns*2+m.collects*.8+.2},
 {id:"npc",kind:"entity",label:"NPC",requires:w=>!w.entities.includes("npc"),score:m=>m.proximity*1.4+m.idle*.25+m.taps*.18},
 {id:"dialogue",kind:"system",label:"대화",requires:w=>!w.systems.includes("dialogue")&&w.entities.includes("npc"),score:m=>m.proximity*1.7+m.idle*.4},
 {id:"projectile",kind:"system",label:"발사",requires:w=>!w.systems.includes("projectile")&&w.entities.includes("target"),score:m=>m.taps*.45+m.targetHits*1.7},
 {id:"construction",kind:"system",label:"건설",requires:w=>!w.systems.includes("construction")&&w.systems.includes("resource"),score:m=>m.returns*1.1+m.idle*.25+m.collects*.5},
 {id:"rounds",kind:"time",label:"라운드",requires:w=>w.time==="continuous"&&(w.entities.includes("hazards")||w.entities.includes("target")),score:m=>m.retries*1.4+m.fast*.8},
 {id:"worldmap",kind:"space",label:"확장공간",requires:w=>w.space!=="worldmap"&&mature(w),score:m=>m.edge*1.4+m.distance*.4}
];
function mature(w){return w.systems.length+w.entities.length>=5}
function freshMetrics(){return{distance:0,fast:0,slow:0,idle:0,edge:0,taps:0,curve:0,proximity:0,targetHits:0,collects:0,returns:0,retries:0}}
function world(){return{control:"direct",space:"flat",time:"continuous",entities:["player"],systems:[],goal:null,visualForm:"dot",mutations:[]}}

function home(){
 cancelAnimationFrame(raf);cancelAnimationFrame(gameRaf);
 const n=loadPack().length;
 root.innerHTML=`<section class="hero"><div class="eyebrow">START FROM NOTHING</div><h1>점 하나만<br>먼저 줄게요.</h1><p>어떤 게임을 만들지 미리 정하지 않습니다. 당신이 노는 방식을 보고, 시스템이 다음에 무엇을 추가하거나 바꿀지 매번 다시 판단합니다.</p><div class="actions"><button class="primary" id="startBtn">새 게임<div class="meta">점 하나에서 시작</div></button><button class="secondary" id="packBtn">내 게임팩<div class="meta">${n}개의 게임</div></button></div></section>`;
 document.getElementById("startBtn").onclick=start;document.getElementById("packBtn").onclick=showPack;
}
function start(){
 s={started:performance.now(),phaseStarted:performance.now(),phase:0,maxPhases:7,w:world(),m:freshMetrics(),total:freshMetrics(),p:{x:.5,y:.5,vx:0,vy:0},ptr:{x:.5,y:.5,down:false},lastPos:{x:.5,y:.5},entities:[],trail:[],resources:0,thought:"아직 아무 가설도 없습니다. 먼저 움직임 자체를 관찰합니다.",history:[]};
 renderWorkbench();spawnForWorld();loop(performance.now());
}
function renderWorkbench(){
 root.innerHTML=`<section class="workbench"><div class="stage" id="stage"><canvas id="cv"></canvas><div class="hud"><span class="pill live">AI가 다음 세계를 결정 중</span><span class="pill" id="phasePill">0 / ${s.maxPhases}</span></div></div><aside class="side"><div class="eyebrow">CURRENT WORLD</div><h3 id="worldTitle">아직 게임이 아닙니다.</h3><p id="worldDesc">점 하나만 있습니다. 무엇을 해야 하는지는 정해져 있지 않습니다.</p><div class="thought" id="thought">${s.thought}</div><div class="stack" id="stack"></div><div class="log" id="log"></div><div class="footnote">여기서 쌓이는 건 장르 점수가 아니라 실제 세계의 문법입니다. 조작·공간·엔티티·시스템이 매번 달라질 수 있습니다.</div></aside></section>`;
 const c=document.getElementById("cv"),st=document.getElementById("stage");resizeCanvas(c,st,610);
 bindPointer(c,s.ptr);
 updateSide();
 window.onresize=()=>resizeCanvas(c,st,innerWidth<820?520:610);
}
function resizeCanvas(c,st,hpx){const d=Math.min(2,devicePixelRatio||1),r=st.getBoundingClientRect();c.width=Math.max(320,Math.floor(r.width*d));c.height=Math.floor(hpx*d);c._d=d}
function bindPointer(c,ptr){
 const pos=e=>{const r=c.getBoundingClientRect(),q=e.touches?.[0]||e;return{x:clamp((q.clientX-r.left)/r.width,0,1),y:clamp((q.clientY-r.top)/r.height,0,1)}};
 const dn=e=>{e.preventDefault();Object.assign(ptr,pos(e),{down:true});s.m.taps++;s.total.taps++};
 const mv=e=>{if(!ptr.down)return;e.preventDefault();Object.assign(ptr,pos(e))};const up=()=>ptr.down=false;
 c.onpointerdown=dn;c.onpointermove=mv;window.onpointerup=up;c.ontouchstart=dn;c.ontouchmove=mv;window.ontouchend=up;
}
function addUnique(arr,x){if(!arr.includes(x))arr.push(x)}
function applyMutation(id){
 const w=s.w;w.mutations.push(id);s.history.push(id);
 if(id==="trail")addUnique(w.systems,"trail");
 if(id==="inertia")w.control="inertia";
 if(id==="target")addUnique(w.entities,"target");
 if(id==="collect")addUnique(w.systems,"collect");
 if(id==="companion")addUnique(w.entities,"companion");
 if(id==="hazards")addUnique(w.entities,"hazards");
 if(id==="depth")w.space="depth";
 if(id==="base")addUnique(w.entities,"base");
 if(id==="resource")addUnique(w.systems,"resource");
 if(id==="upgrade")addUnique(w.systems,"upgrade");
 if(id==="npc")addUnique(w.entities,"npc");
 if(id==="dialogue")addUnique(w.systems,"dialogue");
 if(id==="projectile")addUnique(w.systems,"projectile");
 if(id==="construction")addUnique(w.systems,"construction");
 if(id==="rounds")w.time="rounds";
 if(id==="worldmap")w.space="worldmap";
 w.visualForm=deriveForm(w);
 spawnForWorld();s.thought=explainMutation(id);updateSide();
}
function deriveForm(w){
 if(w.systems.includes("construction"))return"builder";
 if(w.systems.includes("projectile"))return"ship";
 if(w.entities.includes("companion")&&w.systems.includes("dialogue"))return"creature";
 if(w.systems.includes("upgrade")&&w.control==="inertia")return"rover";
 if(w.space==="depth"&&w.control==="inertia")return"glider";
 return w.mutations.length<2?"dot":"agent";
}
function explainMutation(id){
 const t={
  trail:"움직임의 모양 자체가 정보가 될 것 같아서, 이제 세계가 궤적을 기억하게 합니다.",
  inertia:"빠르게 움직이는 방식이 반복되어 직접 위치 이동 대신 관성을 시험합니다.",
  target:"이동 그 자체와 추적 욕구를 구분하기 위해 움직이는 존재를 추가합니다.",
  collect:"공간을 훑는 행동이 보여서, 발견한 것을 '소유'로 바꾸면 반응이 달라지는지 봅니다.",
  companion:"멈추거나 가까이 머무는 행동이 보여, 목표물이 아닌 동행자를 만들어 봅니다.",
  hazards:"이동이 충분히 능동적이라서, 이제 정교한 회피를 요구해 봅니다.",
  depth:"평면 가장자리를 자주 쓰고 있어 공간 자체를 넓혀 입체감에 반응하는지 봅니다.",
  base:"모은 뒤 다시 돌아오는 구조를 만들면 탐색이 루프로 변하는지 시험합니다.",
  resource:"수집한 것을 숫자 자원으로 바꿔 소유와 최적화가 생기는지 봅니다.",
  upgrade:"자원을 다시 성능으로 돌려주는 성장 루프를 추가합니다.",
  npc:"목표물이 아닌 '의도를 가진 타인'을 넣어 관계 반응을 봅니다.",
  dialogue:"NPC 곁에 머무는 행동이 있어 대화를 시스템으로 승격합니다.",
  projectile:"추적만이 아니라 거리에서 직접 개입하는 행동을 허용해 봅니다.",
  construction:"모은 자원을 세계 자체를 바꾸는 데 쓰게 해 봅니다.",
  rounds:"반복 도전이 보여 연속 흐름을 명확한 라운드 구조로 바꿉니다.",
  worldmap:"경계 탐색이 계속되어 한 화면 바깥까지 공간을 확장합니다."
 };return t[id]||"현재 행동을 설명하기 위해 새로운 규칙을 추가합니다.";
}
function chooseMutation(){
 const viable=MUTATIONS.filter(x=>x.requires(s.w));
 const novelty=new Set(s.history.slice(-3));
 const scored=viable.map(x=>({id:x.id,score:x.score(s.m)+(novelty.has(x.id)?-3:0)+Math.random()*.8}));
 scored.sort((a,b)=>b.score-a.score);
 return scored[0]?.id||"trail";
}
function spawnForWorld(){
 s.entities=[];
 const W=s.w;
 if(W.entities.includes("target"))s.entities.push({type:"target",x:.75,y:.35,vx:.0014,vy:.001});
 if(W.entities.includes("companion"))s.entities.push({type:"companion",x:.4,y:.55});
 if(W.entities.includes("npc"))s.entities.push({type:"npc",x:.68,y:.58,speech:"..."});
 if(W.systems.includes("collect"))for(let i=0;i<8;i++)s.entities.push({type:"collect",x:.09+Math.random()*.82,y:.12+Math.random()*.76,on:true});
 if(W.entities.includes("hazards"))for(let i=0;i<5;i++)s.entities.push({type:"hazard",x:.16+i*.17,y:.25+Math.random()*.5,w:.03,h:.18+Math.random()*.1});
 if(W.entities.includes("base"))s.entities.push({type:"base",x:.12,y:.82,r:.07});
}
function updateSide(){
 const w=s.w, stack=document.getElementById("stack"),log=document.getElementById("log"),pill=document.getElementById("phasePill"),thought=document.getElementById("thought"),title=document.getElementById("worldTitle"),desc=document.getElementById("worldDesc");
 if(!stack)return;
 const chips=[["CONTROL",w.control],["SPACE",w.space],["TIME",w.time],...w.entities.filter(x=>x!=="player").map(x=>["ENTITY",x]),...w.systems.map(x=>["SYSTEM",x])];
 stack.innerHTML=chips.map(([a,b])=>`<span class="chip on">${a}: ${b}</span>`).join("");
 log.innerHTML=s.history.slice(-5).reverse().map(id=>`<div class="log-item">+${MUTATIONS.find(x=>x.id===id)?.label||id}</div>`).join("");
 if(pill)pill.textContent=s.phase+" / "+s.maxPhases;if(thought)thought.textContent=s.thought;
 if(title)title.textContent=s.w.mutations.length?humanWorldTitle(w):"아직 게임이 아닙니다.";
 if(desc)desc.textContent=s.w.mutations.length?"지금 보이는 구조도 임시입니다. 다음 행동에 따라 전혀 다른 시스템이 붙을 수 있습니다.":"점 하나만 있습니다. 무엇을 해야 하는지는 정해져 있지 않습니다.";
}
function humanWorldTitle(w){
 const bits=[];if(w.control==="inertia")bits.push("관성 이동");if(w.space==="depth")bits.push("입체 공간");if(w.space==="worldmap")bits.push("확장 공간");if(w.systems.includes("collect"))bits.push("수집");if(w.systems.includes("resource"))bits.push("자원");if(w.systems.includes("upgrade"))bits.push("성장");if(w.systems.includes("dialogue"))bits.push("대화");if(w.systems.includes("construction"))bits.push("건설");if(w.systems.includes("projectile"))bits.push("발사");return bits.slice(0,3).join(" + ")||"형태가 생기는 중";
}
function accumulate(k,v){s.m[k]+=v;s.total[k]+=v}
function update(dt){
