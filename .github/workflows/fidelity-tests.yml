name: Fidelity compiler tests

on:
  push:
    branches: [main]
    paths:
      - "tools/fidelity/**"
      - "tests/test_fidelity.py"
      - "tests/test_production.py"
      - "tests/test_interaction_adapters.py"
      - "production/godot/interaction_runtime/**"
      - ".gitattributes"
      - ".github/workflows/fidelity-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen interaction adapter registry
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            python tools/fidelity/construction.py verify-adapter-registry --baseline-ref "${{ github.event.before }}"
          else
            python tools/fidelity/construction.py verify-adapter-registry
          fi
      - name: Run fidelity unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  interaction-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Verify Godot
        run: godot --version
      - name: Run shared interaction runtime suite
        run: godot --headless --path production/godot/interaction_runtime --script res://headless_tests.gd
      - name: Run Borrowed Shadow compatibility probe
        run: godot --headless --path production/godot/interaction_runtime --script res://borrowed_shadow_probe.gd
